<script>
(function () {
  "use strict";

  const $ = id => document.getElementById(id);
  const PAGE_SIZE = 10;
  const MIN_STAKE = 0.01;
  const MAX_STAKE = 1000;

  const tg = window.Telegram?.WebApp || null;

  const state = {
    initData: "",
    authed: false,
    user: null,
    balance: null,
    rounds: [],
    currentRound: null,
    bets: [],
    walletTx: [],
    pages: { results: 1, trades: 1, wallet: 1 },
    pagination: {
      results: { total: 0, totalPages: 1 },
      trades: { total: 0, totalPages: 1 },
      wallet: { total: 0, totalPages: 1 }
    },
    resultFilter: "all",
    serverOffset: 0,
    lastSync: 0,
    pendingBet: null,
    busy: false,
    polling: false,
    prefs: { sound: false, haptics: true },
    animatedResults: new Set()
  };

  function esc(value) {
    return String(value ?? "").replace(/[&<>"']/g, c => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[c]));
  }

  function money(value) {
    const n = Number(value);
    return Number.isFinite(n)
      ? n.toLocaleString("en-US", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        })
      : "—";
  }

  function dateUTC(value) {
    if (!value) return "";
    const d = new Date(value);
    if (Number.isNaN(d.getTime())) return "";

    return d.toLocaleString("en-GB", {
      timeZone: "UTC",
      day: "2-digit",
      month: "2-digit",
      year: "numeric",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hourCycle: "h23"
    }) + " UTC";
  }

  function serverNow() {
    return Date.now() + state.serverOffset;
  }

  function toast(message, type = "info") {
    const wrap = $("toastWrap");

    if (wrap) {
      const el = document.createElement("div");
      el.className = "toast " + type;

      const icon = {
        success: "✅",
        error: "⛔",
        warn: "⚠️",
        info: "ℹ️"
      }[type] || "ℹ️";

      const ico = document.createElement("span");
      ico.className = "t-ico";
      ico.textContent = icon;

      const text = document.createElement("span");
      text.textContent = message;

      el.append(ico, text);
      wrap.appendChild(el);

      setTimeout(() => {
        el.classList.add("out");
        setTimeout(() => el.remove(), 250);
      }, 3500);

      while (wrap.children.length > 3) {
        wrap.firstElementChild.remove();
      }
    } else {
      console.log(message);
    }
  }

  function haptic(type = "light") {
    try {
      if (tg?.HapticFeedback) {
        tg.HapticFeedback.impactOccurred(type);
      }
    } catch {}
  }

  function notifyHaptic(type = "success") {
    try {
      if (tg?.HapticFeedback) {
        tg.HapticFeedback.notificationOccurred(type);
      }
    } catch {}
  }

  function makeRequestId() {
    if (window.crypto?.randomUUID) {
      return window.crypto.randomUUID();
    }

    if (window.crypto?.getRandomValues) {
      const bytes = new Uint8Array(16);
      window.crypto.getRandomValues(bytes);

      bytes[6] = (bytes[6] & 15) | 64;
      bytes[8] = (bytes[8] & 63) | 128;

      const h = Array.from(bytes, b =>
        b.toString(16).padStart(2, "0")
      ).join("");

      return h.slice(0, 8) + "-" +
        h.slice(8, 12) + "-" +
        h.slice(12, 16) + "-" +
        h.slice(16, 20) + "-" +
        h.slice(20);
    }

    throw new Error("Secure request IDs are not supported.");
  }

  async function fetchJSON(url, options = {}, timeout = 12000) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeout);

    let response;

    try {
      response = await fetch(url, {
        ...options,
        signal: controller.signal,
        cache: "no-store"
      });
    } catch (err) {
      clearTimeout(timer);

      if (err?.name === "AbortError") {
        throw new Error("Request timed out. Check your connection.");
      }

      throw new Error("Network error. Check your connection.");
    }

    clearTimeout(timer);

    let data;

    try {
      data = await response.json();
    } catch {
      throw new Error("Backend returned an invalid response.");
    }

    if (!response.ok || !data || !data.success) {
      throw new Error(data?.message || "Backend request failed.");
    }

    return data;
  }

  async function api(action, extra = {}) {
    if (!state.initData) {
      throw new Error("Open the Mini App through Telegram.");
    }

    return fetchJSON("/api/game", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        initData: state.initData,
        action,
        ...extra
      })
    });
  }

  async function apiRounds(page = state.pages.results) {
    const params = new URLSearchParams({
      page: String(page),
      page_size: String(PAGE_SIZE)
    });

    return fetchJSON("/api/game?" + params.toString(), {
      method: "GET"
    });
  }

  function updateBalance(value) {
    const n = Number(value);

    if (!Number.isFinite(n)) return;

    state.balance = n;

    if ($("homePoints")) $("homePoints").textContent = money(n);
    if ($("gamePoints")) $("gamePoints").textContent = money(n);
    if ($("walletPoints")) $("walletPoints").textContent = money(n);

    if ($("headerBalance")) {
      $("headerBalance").textContent = money(n) + " PTS";
    }

    if ($("modalBalance")) {
      $("modalBalance").textContent = money(n) + " PTS";
    }
  }

  function setStatus(text) {
    ["betStatus", "gameStatus"].forEach(id => {
      const el = $(id);
      if (!el) return;

      el.textContent = text;

      el.classList.toggle(
        "locked",
        text.includes("LOCKED") ||
        text.includes("ERROR") ||
        text.includes("REQUIRED")
      );

      el.classList.toggle(
        "warn",
        text.includes("WAITING") ||
        text.includes("SYNC")
      );
    });
  }

  /* =====================================================
     THEME
     ===================================================== */

  function applyTheme() {
    const dark = tg
      ? tg.colorScheme === "dark"
      : window.matchMedia("(prefers-color-scheme: dark)").matches;

    document.documentElement.setAttribute(
      "data-theme",
      dark ? "dark" : "light"
    );

    const meta = document.querySelector('meta[name="theme-color"]');

    if (meta) {
      meta.content = dark ? "#0b111c" : "#eef2f9";
    }

    try {
      tg?.setHeaderColor?.(dark ? "#121a28" : "#ffffff");
      tg?.setBackgroundColor?.(dark ? "#0b111c" : "#eef2f9");
    } catch {}
  }

  /* =====================================================
     RESULT COLOURS
     0 = RED + VIOLET
     5 = GREEN + VIOLET
     ===================================================== */

  function numClass(n) {
    n = Number(n);

    if (n === 0) return "num-zero";
    if (n === 5) return "num-five";

    return n % 2 === 0 ? "red" : "green";
  }

  function resultColorMarkup(n) {
    n = Number(n);

    if (n === 0) {
      return '<span class="badge loss">RED</span> ' +
             '<span class="badge violet-badge">VIOLET</span>';
    }

    if (n === 5) {
      return '<span class="badge win">GREEN</span> ' +
             '<span class="badge violet-badge">VIOLET</span>';
    }

    return n % 2 === 0
      ? '<span class="badge loss">RED</span>'
      : '<span class="badge win">GREEN</span>';
  }

  function matchesFilter(round) {
    const filter = state.resultFilter;

    if (filter === "all") return true;

    if (
      round.result_number === null ||
      round.result_number === undefined
    ) {
      return false;
    }

    const n = Number(round.result_number);

    if (filter === "red") return n === 0 || n === 2 || n === 4 || n === 6 || n === 8;
    if (filter === "green") return n === 1 || n === 3 || n === 5 || n === 7 || n === 9;
    if (filter === "violet") return n === 0 || n === 5;
    if (filter === "big") return n >= 5;
    if (filter === "small") return n <= 4;

    return true;
  }

  /* =====================================================
     NUMBER BUTTONS
     ===================================================== */

  function renderNumbers(containerId) {
    const box = $(containerId);
    if (!box) return;

    box.innerHTML = "";

    for (let n = 0; n <= 9; n++) {
      const button = document.createElement("button");

      button.type = "button";
      button.className = "number-btn " + numClass(n);
      button.textContent = String(n);
      button.dataset.number = String(n);
      button.setAttribute("aria-label", "Bet on number " + n);

      button.addEventListener("click", () => {
        openBet("Number", n);
      });

      box.appendChild(button);
    }
  }

  /* =====================================================
     PAGINATION
     ===================================================== */

  function renderPager(key) {
    const targets = {
      results: ["resultPagination", "homeResultPagination"],
      trades: ["tradePagination", "homeTradePagination"],
      wallet: ["walletPagination"]
    };

    const p = state.pagination[key];
    const page = state.pages[key];

    const html = `
      <div class="pagination">
        <button type="button"
          data-pager="${key}"
          data-dir="-1"
          ${page <= 1 ? "disabled" : ""}>← Prev</button>

        <span class="page-info">
          Page ${page} / ${p.totalPages}<br>
          ${p.total} records
        </span>

        <button type="button"
          data-pager="${key}"
          data-dir="1"
          ${page >= p.totalPages ? "disabled" : ""}>Next →</button>
      </div>`;

    (targets[key] || []).forEach(id => {
      if ($(id)) $(id).innerHTML = html;
    });
  }

  async function changePage(key, direction) {
    const p = state.pagination[key];
    const next = state.pages[key] + direction;

    if (next < 1 || next > p.totalPages) return;

    state.pages[key] = next;
    haptic();

    if (key === "results") await loadResults();
    if (key === "trades") await loadTrades();
    if (key === "wallet") await loadWalletHistory();
  }

  /* =====================================================
     RESULT HISTORY
     ===================================================== */

  function renderRounds() {
    const list = state.rounds.filter(matchesFilter);

    const html = list.length
      ? list.map(r => {
          const hasResult =
            r.result_number !== null &&
            r.result_number !== undefined;

          const n = hasResult ? Number(r.result_number) : null;

          const result = hasResult
            ? resultColorMarkup(n)
            : '<span class="badge pending">PENDING</span>';

          const size = hasResult
            ? (n >= 5 ? "BIG" : "SMALL")
            : "WAITING";

          const number = hasResult
            ? `<span class="record-number ${numClass(n)}">${n}</span>`
            : '<span class="record-number" style="background:#94a3b8">—</span>';

          return `
            <div class="history-card">
              <div class="row">
                <div>
                  <strong>Period ${esc(r.round_code)}</strong>
                  <div class="utc-time">${esc(dateUTC(r.ends_at))}</div>
                  <div style="margin-top:7px">
                    ${result}
                    <span class="badge neutral">${size}</span>
                  </div>
                </div>
                ${number}
              </div>
              <div class="muted tiny" style="margin-top:8px">
                Round status: ${esc(String(r.status || "").toUpperCase())}
              </div>
            </div>`;
        }).join("")
      : '<div class="empty">No rounds match this filter.</div>';

    ["homeParityRecords", "parityRecords"].forEach(id => {
      if ($(id)) $(id).innerHTML = html;
    });

    renderPager("results");
  }

  async function loadResults() {
    if (!state.authed) return;

    try {
      const d = await apiRounds(state.pages.results);

      state.rounds = d.rounds || [];

      if (d.current_round) {
        state.currentRound = d.current_round;
      }

      if (d.server_time) {
        const serverMs = new Date(d.server_time).getTime();

        if (Number.isFinite(serverMs)) {
          state.serverOffset = serverMs - Date.now();
          state.lastSync = Date.now();
        }
      }

      const p = d.rounds_page || {};

      state.pagination.results.total = Number(p.total || 0);
      state.pagination.results.totalPages =
        Math.max(1, Number(p.total_pages || 1));

      if (state.pages.results > state.pagination.results.totalPages) {
        state.pages.results = state.pagination.results.totalPages;
        return loadResults();
      }

      renderRounds();
      updateRoundDisplay();
    } catch (err) {
      ["homeParityRecords", "parityRecords"].forEach(id => {
        if ($(id)) {
          $(id).innerHTML =
            `<div class="empty">${esc(err.message)}</div>`;
        }
      });
    }
  }

  /* =====================================================
     TRADE HISTORY
     ===================================================== */

  function statusClass(status) {
    const s = String(status || "pending").toLowerCase();

    if (s === "won" || s === "win") return "win";
    if (s === "lost" || s === "loss") return "loss";
    if (s === "cancelled" || s === "canceled") return "cancelled";

    return "pending";
  }

  function renderBets() {
    const html = state.bets.length
      ? state.bets.map(b => {
          const s = String(b.status || "pending").toLowerCase();
          const cls = statusClass(s);
          const payout = Number(b.payout || 0);

          const statusText = s === "won"
            ? "WIN"
            : s === "lost"
              ? "LOSS"
              : s.toUpperCase();

          const selection =
            b.bet_type === "Number" &&
            b.selection !== null &&
            b.selection !== undefined
              ? " · " + esc(b.selection)
              : "";

          const period = b.round_code || b.round_id || "—";

          const result =
            b.result_number !== null &&
            b.result_number !== undefined
              ? "Result: " + esc(b.result_number)
              : "Result: waiting";

          return `
            <div class="history-card ${cls}">
              <div class="row">
                <div>
                  <strong>${esc(b.bet_type)}${selection}</strong>
                  <div class="utc-time">Period ${esc(period)}</div>
                  <div class="utc-time">${esc(dateUTC(b.created_at))}</div>
                </div>
                <span class="badge ${cls}">${statusText}</span>
              </div>

              <div class="row" style="margin-top:10px">
                <span class="small">
                  Stake <strong>${money(b.stake)}</strong>
                </span>
                <span class="small">${result}</span>
              </div>

              <div class="row" style="margin-top:7px">
                <span class="muted small">Test points</span>
                <strong>Payout: ${money(payout)}</strong>
              </div>
            </div>`;
        }).join("")
      : '<div class="empty">No bets recorded yet.</div>';

    ["homeTradeRecords", "tradeHistory"].forEach(id => {
      if ($(id)) $(id).innerHTML = html;
    });

    renderPager("trades");
  }

  async function loadTrades() {
    if (!state.authed) return;

    try {
      const d = await api("my_bets", {
        page: state.pages.trades,
        page_size: PAGE_SIZE
      });

      state.bets = d.bets || [];

      const p = d.pagination || {};

      state.pagination.trades.total = Number(p.total || 0);
      state.pagination.trades.totalPages =
        Math.max(1, Number(p.total_pages || 1));

      if (state.pages.trades > state.pagination.trades.totalPages) {
        state.pages.trades = state.pagination.trades.totalPages;
        return loadTrades();
      }

      renderBets();
    } catch (err) {
      ["homeTradeRecords", "tradeHistory"].forEach(id => {
        if ($(id)) {
          $(id).innerHTML =
            `<div class="empty">${esc(err.message)}</div>`;
        }
      });
    }
  }

  /* =====================================================
     WALLET HISTORY
     ===================================================== */

  function renderWalletHistory() {
    const html = state.walletTx.length
      ? state.walletTx.map(t => {
          const type = String(t.transaction_type || "transaction").toLowerCase();
          const status = String(t.status || "pending").toLowerCase();

          const positive = ["deposit", "payout", "refund"].includes(type);

          const cls =
            status === "completed" || status === "confirmed"
              ? "win"
              : status === "rejected" || status === "failed"
                ? "loss"
                : "pending";

          const sign = positive
            ? "+"
            : ["withdrawal", "bet"].includes(type)
              ? "−"
              : "";

          const tx = t.tx_hash
            ? `<div class="utc-time">TX: ${esc(String(t.tx_hash).slice(0, 18))}…</div>`
            : "";

          return `
            <div class="history-card ${cls}">
              <div class="row">
                <div>
                  <strong>${esc(type.replace(/_/g, " ").toUpperCase())}</strong>
                  <div class="utc-time">${esc(dateUTC(t.created_at))}</div>
                  ${tx}
                </div>
                <span class="badge ${cls}">${esc(status.toUpperCase())}</span>
              </div>

              <div class="row" style="margin-top:10px">
                <span class="muted small">${esc(t.network || "Test wallet")}</span>
                <strong>${sign}${money(t.amount)} Points</strong>
              </div>
            </div>`;
        }).join("")
      : '<div class="empty">No wallet transactions found.</div>';

    if ($("walletHistory")) {
      $("walletHistory").innerHTML = html;
    }

    renderPager("wallet");
  }

  async function loadWalletHistory() {
    if (!state.authed) return;

    try {
      const d = await api("wallet_history", {
        page: state.pages.wallet,
        page_size: PAGE_SIZE
      });

      state.walletTx = d.transactions || [];

      const p = d.pagination || {};

      state.pagination.wallet.total = Number(p.total || 0);
      state.pagination.wallet.totalPages =
        Math.max(1, Number(p.total_pages || 1));

      if (state.pages.wallet > state.pagination.wallet.totalPages) {
        state.pages.wallet = state.pagination.wallet.totalPages;
        return loadWalletHistory();
      }

      renderWalletHistory();
    } catch (err) {
      if ($("walletHistory")) {
        $("walletHistory").innerHTML =
          `<div class="empty">${esc(err.message)}</div>`;
      }
    }
  }

  /* =====================================================
     ROUND TIMER
     ===================================================== */

  function getCurrentOpenRound() {
    const t = serverNow();

    function valid(r) {
      if (!r || r.status !== "open") return false;

      const starts = new Date(r.starts_at).getTime();
      const closes = new Date(r.betting_closes_at).getTime();
      const ends = new Date(r.ends_at).getTime();

      return Number.isFinite(starts) &&
        Number.isFinite(closes) &&
        Number.isFinite(ends) &&
        t >= starts &&
        t < closes &&
        t < ends;
    }

    if (valid(state.currentRound)) return state.currentRound;

    return state.rounds.find(valid) || null;
  }

  function updateBetButtons(enabled) {
    document.querySelectorAll("[data-bet], .number-btn").forEach(button => {
      button.disabled = !enabled;
    });
  }

  function updateRoundDisplay() {
    const round = getCurrentOpenRound();

    if (!round) {
      $("periodId").textContent = "Waiting for next server round…";
      $("gamePeriod").textContent = "Waiting for next server round…";
      $("timer").textContent = "--:--";
      $("gameTimer").textContent = "--:--";

      if ($("timerHint")) $("timerHint").textContent = "waiting";

      const ring = $("ringFg");
      if (ring) {
        ring.style.strokeDashoffset = "339.29";
        ring.classList.remove("urgent");
      }

      setStatus("BETTING LOCKED");
      updateBetButtons(false);
      return;
    }

    $("periodId").textContent = round.round_code;
    $("gamePeriod").textContent = round.round_code;

    const starts = new Date(round.starts_at).getTime();
    const closes = new Date(round.betting_closes_at).getTime();

    const total = Math.max(1, closes - starts);
    const left = Math.max(
      0,
      Math.ceil((closes - serverNow()) / 1000)
    );

    const timerText =
      String(Math.floor(left / 60)).padStart(2, "0") + ":" +
      String(left % 60).padStart(2, "0");

    $("timer").textContent = timerText;
    $("gameTimer").textContent = timerText;

    if ($("timerHint")) {
      $("timerHint").textContent = left <= 10 ? "locking" : "remaining";
    }

    const ring = $("ringFg");

    if (ring) {
      const progress = Math.max(0, Math.min(1, (closes - serverNow()) / total));

      ring.style.strokeDashoffset =
        String(339.29 * (1 - progress));

      ring.classList.toggle("urgent", left <= 10);
    }

    setStatus(left > 0 ? "BETTING OPEN" : "BETTING LOCKED");
    updateBetButtons(state.authed && left > 0);

    if (
      state.pendingBet &&
      state.pendingBet.roundCode !== round.round_code
    ) {
      closeModal("betModal");
      state.pendingBet = null;
    }
  }

  /* =====================================================
     REFRESH DATA
     ===================================================== */

  async function refreshAll(options = {}) {
    if (!state.authed || state.busy) return;

    state.busy = true;

    try {
      const results = await Promise.allSettled([
        apiRounds(state.pages.results),
        api("balance"),
        api("my_bets", {
          page: state.pages.trades,
          page_size: PAGE_SIZE
        })
      ]);

      const roundsResult = results[0];
      const balanceResult = results[1];
      const betsResult = results[2];

      if (roundsResult.status === "fulfilled") {
        const d = roundsResult.value;

        state.rounds = d.rounds || [];
        state.currentRound = d.current_round || null;

        if (d.server_time) {
          const ms = new Date(d.server_time).getTime();

          if (Number.isFinite(ms)) {
            state.serverOffset = ms - Date.now();
            state.lastSync = Date.now();
          }
        }

        const p = d.rounds_page || {};

        state.pagination.results.total = Number(p.total || 0);
        state.pagination.results.totalPages =
          Math.max(1, Number(p.total_pages || 1));

        renderRounds();
      }

      if (balanceResult.status === "fulfilled") {
        updateBalance(balanceResult.value.balance);
      }

      if (betsResult.status === "fulfilled") {
        const d = betsResult.value;

        state.bets = d.bets || [];

        const p = d.pagination || {};

        state.pagination.trades.total = Number(p.total || 0);
        state.pagination.trades.totalPages =
          Math.max(1, Number(p.total_pages || 1));

        renderBets();
      }

      updateRoundDisplay();

      const failed = results.filter(r => r.status === "rejected").length;

      if (failed === 3) {
        throw new Error("Unable to sync with the backend.");
      }

      if ($("serverNotice")) {
        $("serverNotice").textContent = failed
          ? "Some data could not be loaded. Retrying automatically…"
          : "Connected to backend. Server controls betting close time.";
      }
    } catch (err) {
      setStatus("BACKEND ERROR");
      updateBetButtons(false);

      if ($("serverNotice")) {
        $("serverNotice").textContent =
          "Backend unavailable: " + err.message;
      }

      if (!options.silent) toast(err.message, "error");
    } finally {
      state.busy = false;
    }
  }

  /* =====================================================
     NAVIGATION
     ===================================================== */

  function showPage(name) {
    document.querySelectorAll(".page").forEach(page => {
      page.classList.toggle("active", page.id === "page-" + name);
    });

    document.querySelectorAll(".nav-btn").forEach(button => {
      button.classList.toggle("active", button.dataset.page === name);
    });

    if (name === "wallet") loadWalletHistory();

    if (name === "records") {
      loadResults();
      loadTrades();
    }

    haptic();
  }

  /* =====================================================
     MODAL
     ===================================================== */

  function openModal(id) {
    const el = $(id);
    if (!el) return;

    el.classList.add("open");
    document.body.style.overflow = "hidden";
  }

  function closeModal(id) {
    const el = $(id);
    if (!el) return;

    el.classList.remove("open");
    document.body.style.overflow = "";
  }

  /* =====================================================
     BET SELECTION — IMPORTANT FIX
     ===================================================== */

  function openBet(type, selection = null) {
    if (!state.authed) {
      toast("Authenticate through Telegram first.", "warn");
      return;
    }

    const round = getCurrentOpenRound();

    if (!round) {
      toast("No open round. Refreshing server data…", "warn");
      refreshAll({ silent: true });
      return;
    }

    const closes = new Date(round.betting_closes_at).getTime();

    if (serverNow() >= closes) {
      toast("Betting is locked for this round.", "warn");
      refreshAll({ silent: true });
      return;
    }

    /*
     * FIX:
     * Save the selected bet details.
     * Without this object, confirmBet() returns immediately.
     */
    state.pendingBet = {
      type,
      selection,
      roundCode: round.round_code,
      requestId: null,
      stake: null
    };

    $("betModalTitle").textContent =
      "Bet on " + type +
      (selection === null ? "" : " " + selection);

    $("betModalPeriod").textContent =
      "Server round: " + round.round_code;

    $("betAmount").value = "100";
    $("betError").textContent = "";
    $("confirmBet").disabled = false;
    $("confirmBet").textContent = "Place Test Bet";

    if ($("modalBalance")) {
      $("modalBalance").textContent = money(state.balance) + " PTS";
    }

    document.querySelectorAll("#amountPresets button").forEach(button => {
      button.classList.toggle("sel", button.dataset.amount === "100");
    });

    openModal("betModal");
    haptic("medium");
  }

  function validateStake(stake) {
    if (!Number.isFinite(stake)) return "Enter a valid amount.";
    if (stake < MIN_STAKE) return "Minimum stake is 0.01 points.";
    if (stake > MAX_STAKE) return "Maximum stake is 1000 points.";

    if (Math.round(stake * 100) !== stake * 100) {
      return "Use at most 2 decimal places.";
    }

    if (state.balance !== null && stake > state.balance) {
      return "Insufficient test-credit balance.";
    }

    return "";
  }

  /* =====================================================
     PLACE BET
     ===================================================== */

  async function confirmBet() {
    const pending = state.pendingBet;

    if (!pending || !state.authed) {
      toast("Select a prediction first.", "warn");
      return;
    }

    const round = getCurrentOpenRound();

    if (!round || round.round_code !== pending.roundCode) {
      toast("This round has ended. Select the next round.", "warn");

      closeModal("betModal");
      state.pendingBet = null;

      await refreshAll({ silent: true });
      return;
    }

    const closes = new Date(round.betting_closes_at).getTime();

    if (serverNow() >= closes) {
      toast("Betting is locked for this round.", "warn");

      closeModal("betModal");
      state.pendingBet = null;

      await refreshAll({ silent: true });
      return;
    }

    const stake = Number($("betAmount").value);
    const validationError = validateStake(stake);

    if (validationError) {
      $("betError").textContent = validationError;
      toast(validationError, "warn");
      return;
    }

    const button = $("confirmBet");

    button.disabled = true;
    button.textContent = "Placing…";

    /*
     * Keep the same request ID for retrying the same bet.
     */
    if (!pending.requestId || pending.stake !== stake) {
      pending.requestId = makeRequestId();
      pending.stake = stake;
    }

    const oldBalance = state.balance;

    try {
      const result = await api("place_bet", {
        round_code: pending.roundCode,
        bet_type: pending.type,
        selection: pending.type === "Number" ? pending.selection : null,
        stake: pending.stake,
        request_id: pending.requestId
      });

      state.pendingBet = null;

      closeModal("betModal");

      toast(result.message || "Test bet accepted.", "success");
      notifyHaptic("success");

      await refreshAll({ silent: true });
      await loadTrades();
    } catch (err) {
      /*
       * Do not create a new request ID automatically after an
       * uncertain network error. Retrying the same payload helps
       * the server identify a duplicate request.
       */
      if (oldBalance !== null) {
        updateBalance(oldBalance);
      }

      $("betError").textContent = err.message;
      toast(err.message || "Unable to place bet.", "error");
      notifyHaptic("error");
    } finally {
      button.disabled = false;
      button.textContent = "Place Test Bet";
    }
  }

  /* =====================================================
     AUTHENTICATION
     ===================================================== */

  async function authenticate() {
    try {
      if (!tg) {
        $("profileName").textContent = "Not opened in Telegram";
        $("profileStatus").textContent =
          "Open the Mini App inside Telegram to authenticate.";

        setStatus("TELEGRAM REQUIRED");
        return;
      }

      tg.ready();
      tg.expand();

      state.initData = tg.initData || "";

      if (!state.initData) {
        $("profileName").textContent = "Telegram initData missing";
        $("profileStatus").textContent =
          "Open the official Telegram Mini App.";

        setStatus("AUTH REQUIRED");
        return;
      }

      const data = await fetchJSON("/api/auth", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ initData: state.initData })
      });

      state.authed = true;
      state.user = data.user;

      $("profileName").textContent = data.user.username
        ? "@" + data.user.username
        : "Telegram user " + data.user.telegram_id;

      $("profileStatus").textContent =
        "Telegram identity verified by server.";

      await refreshAll({ silent: true });
      await loadWalletHistory();

      toast("Connected successfully.", "success");
    } catch (err) {
      state.authed = false;

      $("profileStatus").textContent = err.message;
      setStatus("BACKEND ERROR");

      toast(err.message, "error");
    }
  }

  /* =====================================================
     EVENT LISTENERS
     ===================================================== */

  function initEvents() {
    document.querySelectorAll(".nav-btn").forEach(button => {
      button.addEventListener("click", () => {
        showPage(button.dataset.page);
      });
    });

    document.querySelectorAll("[data-page-go]").forEach(button => {
      button.addEventListener("click", () => {
        showPage(button.dataset.pageGo);
      });
    });

    $("headerProfile")?.addEventListener("click", () => {
      showPage("profile");
    });

    $("refreshBtn")?.addEventListener("click", async () => {
      await refreshAll();
      await loadResults();
      toast("Refreshed.", "success");
    });

    $("walletRefresh")?.addEventListener("click", async () => {
      await refreshAll({ silent: true });
      await loadWalletHistory();
      toast("Wallet refreshed.", "success");
    });

    $("authRetry")?.addEventListener("click", authenticate);

    $("confirmBet")?.addEventListener("click", confirmBet);

    /*
     * Use event delegation for all colour/Big/Small buttons.
     */
    document.addEventListener("click", event => {
      const betButton = event.target.closest("[data-bet]");

      if (betButton && !betButton.disabled) {
        openBet(betButton.dataset.bet);
        return;
      }

      const pager = event.target.closest("[data-pager]");

      if (pager && !pager.disabled) {
        changePage(pager.dataset.pager, Number(pager.dataset.dir));
        return;
      }

      const filter = event.target.closest("[data-filter]");

      if (filter) {
        state.resultFilter = filter.dataset.filter;

        document.querySelectorAll('[data-filters="results"] [data-filter]')
          .forEach(button => {
            button.classList.toggle(
              "active",
              button.dataset.filter === state.resultFilter
            );
          });

        renderRounds();
        return;
      }

      const closeButton = event.target.closest("[data-close]");

      if (closeButton) {
        closeModal(closeButton.dataset.close);
        state.pendingBet = null;
        return;
      }
    });

    document.querySelectorAll(".modal-backdrop").forEach(modal => {
      modal.addEventListener("click", event => {
        if (event.target === modal) {
          closeModal(modal.id);
          state.pendingBet = null;
        }
      });
    });

    $("betAmount")?.addEventListener("input", () => {
      if ($("betError")) $("betError").textContent = "";

      if (state.pendingBet) {
        state.pendingBet.requestId = null;
        state.pendingBet.stake = null;
      }

      document.querySelectorAll("#amountPresets button").forEach(button => {
        button.classList.remove("sel");
      });
    });

    document.querySelectorAll("[data-amount]").forEach(button => {
      button.addEventListener("click", () => {
        $("betAmount").value = button.dataset.amount;

        if (state.pendingBet) {
          state.pendingBet.requestId = null;
          state.pendingBet.stake = null;
        }

        document.querySelectorAll("#amountPresets button").forEach(b => {
          b.classList.toggle("sel", b === button);
        });

        $("betError").textContent = "";
      });
    });

    $("minusAmount")?.addEventListener("click", () => {
      const n = Math.max(
        MIN_STAKE,
        (Number($("betAmount").value) || 1) - 10
      );

      $("betAmount").value = n.toFixed(2);

      if (state.pendingBet) {
        state.pendingBet.requestId = null;
        state.pendingBet.stake = null;
      }
    });

    $("plusAmount")?.addEventListener("click", () => {
      const n = Math.min(
        MAX_STAKE,
        (Number($("betAmount").value) || 1) + 10
      );

      $("betAmount").value = n.toFixed(2);

      if (state.pendingBet) {
        state.pendingBet.requestId = null;
        state.pendingBet.stake = null;
      }
    });

    $("maxAmount")?.addEventListener("click", () => {
      if (state.balance === null) return;

      $("betAmount").value = Math.min(
        MAX_STAKE,
        state.balance
      ).toFixed(2);

      if (state.pendingBet) {
        state.pendingBet.requestId = null;
        state.pendingBet.stake = null;
      }
    });

    $("soundToggle")?.addEventListener("click", () => {
      state.prefs.sound = !state.prefs.sound;

      $("soundToggle").textContent = state.prefs.sound ? "ON" : "OFF";
      $("soundToggle").classList.toggle("active", state.prefs.sound);
      $("soundToggle").setAttribute("aria-pressed", String(state.prefs.sound));
    });

    $("hapticToggle")?.addEventListener("click", () => {
      state.prefs.haptics = !state.prefs.haptics;

      $("hapticToggle").textContent = state.prefs.haptics ? "ON" : "OFF";
      $("hapticToggle").classList.toggle("active", state.prefs.haptics);
      $("hapticToggle").setAttribute("aria-pressed", String(state.prefs.haptics));

      haptic("light");
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && $("betModal")?.classList.contains("open")) {
        closeModal("betModal");
        state.pendingBet = null;
      }
    });

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && state.authed) {
        refreshAll({ silent: true });
      }
    });

    window.addEventListener("online", () => {
      $("offlineBar")?.classList.remove("show");

      if (state.authed) {
        refreshAll({ silent: true });
      }
    });

    window.addEventListener("offline", () => {
      $("offlineBar")?.classList.add("show");
    });

    try {
      tg?.onEvent?.("themeChanged", applyTheme);
      tg?.BackButton?.onClick(() => showPage("home"));
    } catch {}
  }

  /* =====================================================
     STARTUP
     ===================================================== */

  function init() {
    applyTheme();

    renderNumbers("numberGrid");
    renderNumbers("gameNumberGrid");

    initEvents();

    if ($("buildInfo")) {
      $("buildInfo").textContent =
        "Build " + new Date().toISOString().slice(0, 10);
    }

    authenticate();

    /*
     * Update the countdown every second.
     */
    setInterval(() => {
      if (state.authed) {
        updateRoundDisplay();
      }
    }, 1000);

    /*
     * Refresh from server every 3 seconds. The frontend cannot
     * create a missing round; api/cron.js must create it.
     */
    setInterval(() => {
      if (state.authed && !state.busy && !document.hidden) {
        refreshAll({ silent: true });
      }
    }, 3000);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init, { once: true });
  } else {
    init();
  }
})();
</script>
