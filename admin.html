<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#090909">
<title>Crypto Trader Pro | Admin</title>

<style>
:root {
  color-scheme: dark;
  --bg: #090909;
  --panel: #121212;
  --panel2: #191919;
  --line: #303030;
  --text: #f5f5f5;
  --muted: #999;
  --yellow: #f5c518;
  --green: #35dc88;
  --red: #ff5263;
  --violet: #a78bfa;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  overflow-x: hidden;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 system-ui, sans-serif;
}

button, input, select { font: inherit; }

button {
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 10px 13px;
  background: var(--panel2);
  color: var(--text);
  cursor: pointer;
  touch-action: manipulation;
}

button:hover { border-color: var(--yellow); }
button:disabled { opacity: .45; cursor: not-allowed; }

button.primary {
  background: var(--yellow);
  color: #111;
  border-color: var(--yellow);
  font-weight: 800;
}

input, select {
  width: 100%;
  min-width: 0;
  padding: 11px;
  background: #0c0c0c;
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: 9px;
}

.hide { display: none !important; }
.muted { color: var(--muted); }
.err { color: var(--red); }
.small { font-size: 11px; }
.good-text { color: var(--green); }
.bad-text { color: var(--red); }

header {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  padding: 12px 15px;
  background: #0a0a0af5;
  border-bottom: 1px solid #383018;
  backdrop-filter: blur(12px);
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo {
  width: 40px;
  height: 40px;
  flex: 0 0 40px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: var(--yellow);
  color: #111;
  font-size: 17px;
  font-weight: 950;
}

.brand h1 {
  margin: 0;
  font-size: 14px;
  letter-spacing: .5px;
}

.brand p {
  margin: 2px 0 0;
  color: var(--yellow);
  font-size: 10px;
  letter-spacing: 1.5px;
}

.head-actions {
  display: flex;
  gap: 7px;
}

.layout {
  display: grid;
  grid-template-columns: 215px minmax(0, 1fr);
  max-width: 1650px;
  min-height: calc(100vh - 65px);
  margin: auto;
}

aside {
  min-width: 0;
  padding: 12px 9px;
  border-right: 1px solid var(--line);
  background: #0d0d0d;
}

.nav-label {
  margin: 12px 10px 7px;
  color: #777;
  font-size: 10px;
  letter-spacing: 1.5px;
}

nav {
  display: grid;
  gap: 5px;
}

nav button {
  text-align: left;
  background: transparent;
  border-color: transparent;
  color: #aaa;
}

nav button.active {
  background: #30280d;
  border-color: #66551a;
  color: var(--yellow);
  box-shadow: inset 3px 0 var(--yellow);
}

main {
  min-width: 0;
  padding: 22px;
}

.pagehead {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 15px;
}

.pagehead h2 {
  margin: 0;
  font-size: 24px;
}

.pagehead p {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 12px;
}

.search {
  display: flex;
  gap: 8px;
  margin: 16px 0;
  max-width: 720px;
}

.search input { flex: 1; }

.cards {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
  margin: 12px 0;
}

.card {
  min-width: 0;
  padding: 15px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: linear-gradient(145deg, #191919, #101010);
  overflow-wrap: anywhere;
}

.card .label {
  color: var(--muted);
  font-size: 11px;
}

.card .value {
  margin-top: 7px;
  color: var(--yellow);
  font-size: clamp(17px, 2vw, 25px);
  font-weight: 850;
  overflow-wrap: anywhere;
}

.card .sub {
  margin-top: 5px;
  color: #888;
  font-size: 11px;
}

h3 {
  margin: 24px 0 10px;
  font-size: 15px;
}

.note {
  margin: 12px 0;
  padding: 12px;
  border: 1px solid #51441c;
  border-radius: 10px;
  background: #211c0d;
  color: #e9d99c;
  font-size: 12px;
  overflow-wrap: anywhere;
}

.note.good {
  border-color: #24583d;
  background: #102419;
  color: var(--green);
}

.note.bad {
  border-color: #65303a;
  background: #271216;
  color: #ffabb4;
}

.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 12px 0;
}

.filters input, .filters select {
  flex: 1 1 140px;
  width: auto;
}

.wrap {
  width: 100%;
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: #0d0d0d;
  -webkit-overflow-scrolling: touch;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}

th, td {
  padding: 10px;
  text-align: left;
  white-space: nowrap;
  border-bottom: 1px solid #282828;
}

th {
  background: #1a1a1a;
  color: var(--yellow);
  font-weight: 750;
}

tr:hover td { background: #181818; }
tr:last-child td { border-bottom: 0; }

.badge {
  display: inline-block;
  padding: 3px 8px;
  border: 1px solid #444;
  border-radius: 99px;
  background: #222;
  font-size: 10px;
}

.badge.won, .badge.settled, .badge.completed,
.badge.confirmed, .badge.success {
  color: var(--green);
  border-color: #24583d;
  background: #102419;
}

.badge.lost, .badge.failed, .badge.rejected,
.badge.denied {
  color: var(--red);
  border-color: #65303a;
  background: #271216;
}

.badge.pending, .badge.open, .badge.locked {
  color: var(--yellow);
  border-color: #51441c;
  background: #211c0d;
}

.link {
  color: var(--yellow);
  text-decoration: none;
}

.link:hover { text-decoration: underline; }

.panel {
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--panel);
  overflow-wrap: anywhere;
}

.chartbox {
  margin-bottom: 12px;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--panel);
  overflow: hidden;
}

.chartbox svg {
  display: block;
  width: 100%;
  height: auto;
}

.empty {
  padding: 22px;
  color: var(--muted);
  text-align: center;
}

.pager {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 12px;
}

.login-wrap {
  min-height: 100vh;
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: 18px;
  background: radial-gradient(ellipse at top, #30280d, transparent 55%), #090909;
}

.login {
  width: 100%;
  max-width: 410px;
  padding: 25px;
  border: 1px solid #66551a;
  border-radius: 18px;
  background: #121212;
  box-shadow: 0 20px 80px #0009;
}

.login h2 { margin: 15px 0 4px; }
.login p { color: var(--muted); font-size: 12px; }
.login label { display: block; margin-top: 12px; }
.login input { margin-top: 6px; }
.login button { width: 100%; margin-top: 16px; }

@media(max-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr); }

  aside {
    position: sticky;
    top: 62px;
    z-index: 20;
    padding: 6px;
    border-right: 0;
    border-bottom: 1px solid var(--line);
    overflow: hidden;
  }

  nav {
    display: flex;
    overflow-x: auto;
    gap: 5px;
  }

  nav button {
    flex: 0 0 auto;
    white-space: nowrap;
    font-size: 12px;
  }

  .nav-label { display: none; }
  main { padding: 14px; }
  .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media(max-width: 480px) {
  header { padding: 9px; }
  .brand h1 { font-size: 12px; }
  .brand p { font-size: 9px; }
  .logo { width: 34px; height: 34px; flex-basis: 34px; }
  .head-actions button { padding: 8px; font-size: 11px; }
  main { padding: 10px; }
  .pagehead h2 { font-size: 20px; }
  .card { padding: 11px; }
  .card .value { font-size: 16px; }
  .search button { padding: 8px; }
}

@media(max-width: 340px) {
  .cards { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<div id="loginView" class="login-wrap hide">
  <form id="loginForm" class="login">
    <div class="logo">CT</div>
    <h2>Admin Console</h2>
    <p>Crypto Trader Pro · Secure administrator access</p>

    <label for="username">Username</label>
    <input id="username" autocomplete="username" maxlength="200" required>

    <label for="password">Password</label>
    <input id="password" type="password"
           autocomplete="current-password" maxlength="200" required>

    <button id="loginBtn" class="primary" type="submit">
      SIGN IN SECURELY
    </button>

    <p id="loginMsg" class="err" role="alert"></p>
    <p class="small">Keep your administrator credentials private.</p>
  </form>
</div>

<div id="appView" class="hide">
  <header>
    <div class="brand">
      <div class="logo">CT</div>
      <div>
        <h1>CRYPTO TRADER PRO</h1>
        <p>ADMIN CONTROL CENTER</p>
      </div>
    </div>

    <div class="head-actions">
      <button id="refreshBtn" type="button">↻ Refresh</button>
      <button id="logoutBtn" type="button">Log out</button>
    </div>
  </header>

  <div class="layout">
    <aside>
      <div class="nav-label">MANAGEMENT</div>
      <nav id="nav" aria-label="Admin navigation"></nav>
    </aside>

    <main>
      <div class="pagehead">
        <div>
          <h2 id="pageTitle">Dashboard</h2>
          <p id="pageSubtitle">System overview</p>
        </div>
        <span id="lastUpdated" class="muted small"></span>
      </div>

      <div class="search">
        <input id="globalSearch"
               aria-label="Global search"
               placeholder="Search user, Telegram ID, round or bet">
        <button id="searchBtn" class="primary" type="button">Search</button>
      </div>

      <div id="content"></div>
    </main>
  </div>
</div>

<script>
"use strict";

const $ = selector => document.querySelector(selector);

const esc = value => String(value ?? "").replace(/[&<>"']/g, ch => ({
  "&": "&amp;",
  "<": "&lt;",
  ">": "&gt;",
  '"': "&quot;",
  "'": "&#39;"
}[ch]));

const fmt = value => Number(value || 0).toLocaleString(undefined, {
  maximumFractionDigits: 2
});

const dt = value => {
  if (!value) return "-";
  const date = new Date(value);
  return Number.isNaN(date.getTime()) ? "-" : esc(date.toLocaleString());
};

const badge = value =>
  `<span class="badge ${esc(value)}">${esc(value)}</span>`;

const yn = value => value ? "Yes" : "No";

const userLink = value => value == null || value === ""
  ? "-"
  : `<a href="#" class="link" data-user="${esc(value)}">${esc(value)}</a>`;

const roundLink = value => value
  ? `<a href="#" class="link" data-round="${esc(value)}">${esc(value)}</a>`
  : "-";

const transactionStatuses = [
  "pending", "confirmed", "rejected", "completed", "failed"
];

const transactionColumns = [
  ["id", "ID"],
  ["user_id", "User ID", userLink],
  ["transaction_type", "Type"],
  ["amount", "Amount"],
  ["status", "Status", badge],
  ["network", "Network"],
  ["tx_hash", "Transaction hash"],
  ["created_at", "Created", dt],
  ["updated_at", "Updated", dt]
];

const VIEWS = {
  dashboard: {
    label: "Dashboard",
    icon: "▦",
    subtitle: "Live system overview"
  },
  analytics: {
    label: "Analytics",
    icon: "⌁",
    subtitle: "Activity and result distribution"
  },
  reconcile: {
    label: "Reconcile",
    icon: "⇄",
    subtitle: "Wallet and ledger checks"
  },
  users: {
    label: "Users",
    icon: "♙",
    subtitle: "Profiles and referrals",
    action: "users",
    key: "users",
    exportKind: "users",
    filters: [{name: "q", placeholder: "Telegram ID or username"}],
    cols: [
      ["id", "User ID", userLink],
      ["telegram_id", "Telegram ID"],
      ["username", "Username"],
      ["balance", "Balance"],
      ["referral_count", "Referrals"],
      ["referred_by", "Referred by", userLink],
      ["referral_code", "Referral code"],
      ["created_at", "Registered", dt]
    ]
  },
  wallets: {
    label: "Wallets",
    icon: "◈",
    subtitle: "Read-only wallet balances",
    action: "wallets",
    key: "wallets",
    note: "Read-only wallet monitoring. No balance modifications are available.",
    filters: [{name: "q", placeholder: "Telegram ID or username"}],
    cols: [
      ["user_id", "User ID", userLink],
      ["telegram_id", "Telegram ID"],
      ["username", "Username"],
      ["balance", "Balance"],
      ["updated_at", "Updated", dt]
    ]
  },
  transactions: {
    label: "Transactions",
    icon: "⇅",
    subtitle: "Transaction history",
    action: "transactions",
    key: "transactions",
    exportKind: "transactions",
    filters: [
      {name: "user_id", placeholder: "User ID"},
      {name: "status", placeholder: "Any status", options: transactionStatuses}
    ],
    cols: transactionColumns
  },
  deposits: {
    label: "Deposits",
    icon: "↓",
    subtitle: "Recorded deposits",
    action: "transactions",
    key: "transactions",
    exportKind: "transactions",
    fixed: {type: "deposit"},
    note: "Read-only. Deposit approval is not implemented by this interface.",
    filters: [
      {name: "user_id", placeholder: "User ID"},
      {name: "status", placeholder: "Any status", options: transactionStatuses}
    ],
    cols: transactionColumns
  },
  withdrawals: {
    label: "Withdrawals",
    icon: "↑",
    subtitle: "Recorded withdrawals",
    action: "transactions",
    key: "transactions",
    exportKind: "transactions",
    fixed: {type: "withdrawal"},
    note: "Read-only. Withdrawal approval is not implemented by this interface.",
    filters: [
      {name: "user_id", placeholder: "User ID"},
      {name: "status", placeholder: "Any status", options: transactionStatuses}
    ],
    cols: transactionColumns
  },
  rounds: {
    label: "Game Rounds",
    icon: "◷",
    subtitle: "Round timing and settlement",
    action: "rounds",
    key: "rounds",
    note: "Round results are read-only.",
    cols: [
      ["round_code", "Round", roundLink],
      ["status", "Status", badge],
      ["starts_at", "Starts", dt],
      ["betting_closes_at", "Betting closes", dt],
      ["ends_at", "Ends", dt],
      ["result_number", "Result"],
      ["bet_count", "Bets"],
      ["total_stake", "Stake"],
      ["total_payout", "Payout"],
      ["pending_bets", "Pending bets"],
      ["payout_complete", "Payout complete", yn]
    ]
  },
  bets: {
    label: "Bets",
    icon: "◉",
    subtitle: "Bet records and outcomes",
    action: "bets",
    key: "bets",
    exportKind: "bets",
    filters: [
      {name: "round_code", placeholder: "Round code"},
      {name: "user_id", placeholder: "User ID"},
      {
        name: "status",
        placeholder: "Any status",
        options: ["pending", "won", "lost", "cancelled"]
      }
    ],
    cols: [
      ["id", "Bet ID"],
      ["user_id", "User ID", userLink],
      ["round_code", "Round", roundLink],
      ["bet_type", "Type"],
      ["selection", "Selection"],
      ["stake", "Stake"],
      ["fee", "Fee"],
      ["status", "Status", badge],
      ["result_number", "Result"],
      ["payout", "Payout"],
      ["created_at", "Created", dt],
      ["settled_at", "Settled", dt]
    ]
  },
  audit: {
    label: "Audit Logs",
    icon: "≡",
    subtitle: "Administrator activity history",
    action: "audit",
    key: "entries",
    cols: [
      ["id", "ID"],
      ["created_at", "Time", dt],
      ["admin_username", "Admin"],
      ["action", "Action"],
      ["target_type", "Target"],
      ["target_id", "Target ID"],
      ["outcome", "Outcome", badge],
      ["ip", "IP"]
    ]
  }
};

let currentView = "dashboard";
let currentPage = 1;
let activeFilters = {};
let requestSequence = 0;

async function api(body) {
  const response = await fetch("/api/admin", {
    method: "POST",
    credentials: "same-origin",
    headers: {
      "Content-Type": "application/json",
      "X-Admin-Request": "1"
    },
    body: JSON.stringify(body)
  });

  let data = {};

  try {
    data = await response.json();
  } catch {}

  if (response.status === 401 && body.action !== "login") {
    showLogin("Session expired. Please log in again.");
    throw new Error("auth");
  }

  if (!response.ok) {
    throw new Error(data.message || "Request failed.");
  }

  return data;
}

function card(label, value, subtitle = "") {
  return `
    <div class="card">
      <div class="label">${esc(label)}</div>
      <div class="value">${esc(value ?? "-")}</div>
      ${subtitle ? `<div class="sub">${esc(subtitle)}</div>` : ""}
    </div>`;
}

function section(title, content) {
  return `<h3>${esc(title)}</h3>${content}`;
}

function renderTable(rows, columns) {
  if (!Array.isArray(rows) || !rows.length) {
    return '<div class="empty">No records found.</div>';
  }

  return `
    <div class="wrap">
      <table>
        <thead>
          <tr>${columns.map(col => `<th>${esc(col[1])}</th>`).join("")}</tr>
        </thead>
        <tbody>
          ${rows.map(row => `
            <tr>
              ${columns.map(col => {
                const value = row[col[0]];
                const rendered = col[2]
                  ? col[2](value, row)
                  : value == null || value === ""
                    ? "-"
                    : esc(value);

                return `<td>${rendered}</td>`;
              }).join("")}
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>`;
}

function renderDashboard(data) {
  const totals = data.totals || {};
  const health = data.health || {};

  const metricCards = [
    card("Registered users", fmt(totals.users)),
    card("Total bets", fmt(totals.bets)),
    card("Total stake", fmt(totals.total_stake)),
    card("Platform fees", fmt(totals.total_fees)),
    card("Total payouts", fmt(totals.total_payouts)),
    card("Referral commissions", fmt(totals.total_commissions)),
    card("Wallet balances", fmt(totals.total_wallet_balance)),
    card("Deposits", fmt(totals.total_deposits), `${fmt(totals.deposit_count)} records`),
    card("Withdrawals", fmt(totals.total_withdrawals), `${fmt(totals.withdrawal_count)} records`)
  ].join("");

  const healthCards = [
    card("Database", health.database_ok ? "Connected" : "Check"),
    card("Cron / settlement", health.cron_ok ? "Healthy" : "Investigate"),
    card("Overdue rounds", fmt(health.overdue_rounds)),
    card("Old pending bets", fmt(health.old_pending_bets)),
    card("Last settled", health.last_settled_at ? dt(health.last_settled_at) : "-"),
    card("Latest round", health.latest_round_start ? dt(health.latest_round_start) : "-")
  ].join("");

  const statuses = (data.round_statuses || [])
    .map(item => `${esc(item.status)}: ${esc(item.count)}`)
    .join(" · ");

  $("#content").innerHTML =
    '<div class="note">Monitoring mode enabled. Financial actions are read-only.</div>' +
    `<div class="cards">${metricCards}</div>` +
    section("System Health", `<div class="cards">${healthCards}</div>`) +
    section("Rounds by Status", `<div class="panel">${statuses || "No round data"}</div>`) +
    section("Recent Game Rounds", renderTable(data.recent_rounds, VIEWS.rounds.cols));
}

function renderChart(title, labels, series, colors, names) {
  const width = 600;
  const height = 190;
  const left = 45;
  const right = 10;
  const top = 15;
  const bottom = 27;

  const allValues = series.flat().map(value => Number(value) || 0);
  const maxValue = Math.max(1, ...allValues);
  const minValue = Math.min(0, ...allValues);

  const plotWidth = width - left - right;
  const plotHeight = height - top - bottom;
  const count = Math.max(1, labels.length);
  const groupWidth = plotWidth / count;
  const barWidth = Math.max(3, (groupWidth - 5) / Math.max(1, series.length));

  const y = value => top + plotHeight * (maxValue - value) /
    (maxValue - minValue);

  let svg = "";

  for (let i = 0; i < 4; i++) {
    const value = minValue + (maxValue - minValue) * i / 3;
    const yy = y(value);

    svg += `
      <line x1="${left}" x2="${width-right}" y1="${yy}" y2="${yy}"
        stroke="#303030"/>
      <text x="${left-5}" y="${yy+3}" text-anchor="end"
        fill="#999" font-size="9">${esc(Math.round(value))}</text>`;
  }

  series.forEach((values, seriesIndex) => {
    values.forEach((value, index) => {
      const yy = y(Number(value) || 0);
      const zero = y(0);
      const x = left + index * groupWidth + 2 + seriesIndex * barWidth;

      svg += `
        <rect x="${x}" y="${Math.min(yy, zero)}"
          width="${Math.max(2, barWidth-2)}"
          height="${Math.max(1, Math.abs(zero-yy))}"
          rx="2" fill="${colors[seriesIndex]}"/>`;
    });
  });

  labels.forEach((label, index) => {
    if (index % 2 === 0) {
      svg += `
        <text x="${left+index*groupWidth+groupWidth/2}"
          y="${height-7}" text-anchor="middle"
          fill="#999" font-size="9">${esc(label)}</text>`;
    }
  });

  return `
    <div class="chartbox">
      <b>${esc(title)}</b>
      <svg viewBox="0 0 ${width} ${height}" role="img"
        aria-label="${esc(title)}">${svg}</svg>
      <div class="muted small">
        ${names.map((name, index) =>
          `<span style="margin-right:12px">
            <span style="color:${colors[index]}">■</span>
            ${esc(name)}
          </span>`
        ).join("")}
      </div>
    </div>`;
}

function renderAnalytics(data) {
  const daily = data.daily || [];
  const fairness = data.fairness || {
    counts: Array(10).fill(0),
    total_rounds: 0,
    verdict: "No data"
  };

  const labels = daily.map(item => String(item.day || "").slice(5));

  const distribution = (fairness.counts || []).map((count, number) => ({
    number,
    count,
    share: fairness.total_rounds
      ? `${(count / fairness.total_rounds * 100).toFixed(1)}%`
      : "-",
    diff: fairness.total_rounds
      ? Number(count - fairness.total_rounds / 10).toFixed(1)
      : "-"
  }));

  $("#content").innerHTML =
    '<div class="note">Statistical indicators do not prove that a game is fair or unfair.</div>' +

    renderChart(
      "Daily Stake vs Payouts",
      labels,
      [daily.map(x => +x.stake), daily.map(x => +x.payout)],
      ["#f5c518", "#35dc88"],
      ["Stake", "Payouts"]
    ) +

    renderChart(
      "Daily Net Indicator",
      labels,
      [daily.map(x => +x.net)],
      ["#a78bfa"],
      ["Net indicator"]
    ) +

    renderChart(
      "Users Per Day",
      labels,
      [daily.map(x => +x.active_users), daily.map(x => +x.new_users)],
      ["#f5c518", "#35dc88"],
      ["Active users", "New users"]
    ) +

    section("Daily Metrics", renderTable(daily.slice().reverse(), [
      ["day", "Day (UTC)"],
      ["bets", "Bets"],
      ["stake", "Stake"],
      ["payout", "Payouts"],
      ["net", "Net"],
      ["active_users", "Active users"],
      ["new_users", "New users"]
    ])) +

    section("Result Distribution",
      `<div class="note">${esc(fairness.verdict)} · ${esc(fairness.total_rounds || 0)} rounds</div>` +
      renderTable(distribution, [
        ["number", "Result"],
        ["count", "Count"],
        ["share", "Share"],
        ["diff", "Vs expected"]
      ])
    ) +

    section("Top Users by Stake", renderTable(data.top_users, [
      ["id", "User ID", userLink],
      ["username", "Username"],
      ["bets", "Bets"],
      ["stake", "Stake"],
      ["payout", "Payout"],
      ["user_net", "User net"]
    ])) +

    section("Large Stakes", renderTable(data.large_stakes, [
      ["id", "Bet ID"],
      ["user_id", "User ID", userLink],
      ["round_code", "Round", roundLink],
      ["bet_type", "Type"],
      ["stake", "Stake"],
      ["created_at", "Created", dt]
    ])) +

    section("High-Return Users", renderTable(data.high_return_users, [
      ["user_id", "User ID", userLink],
      ["bets", "Bets"],
      ["stake", "Stake"],
      ["payout", "Payout"],
      ["return_percent", "Return %"]
    ]));
}

function renderReconcile(data) {
  const totals = data.totals || {};

  const rows = [
    {check: "Wallet total", a: totals.wallet_total, b: "-", diff: "-"},
    {
      check: "Ledger net + commissions",
      a: totals.wallet_total,
      b: Number(totals.ledger_net || 0) + Number(totals.commissions || 0),
      diff: totals.unrecorded
    },
    {
      check: "Bet stakes vs transactions",
      a: totals.bets_stake,
      b: totals.bet_tx,
      diff: totals.stake_diff
    },
    {
      check: "Bet payouts vs transactions",
      a: totals.bets_payout,
      b: totals.payout_tx,
      diff: totals.payout_diff
    }
  ];

  $("#content").innerHTML =
    `<div class="note ${data.clean ? "good" : "bad"}">${
      data.clean
        ? "Configured reconciliation checks match."
        : "Mismatch detected or reconciliation is not configured. Investigate before taking action."
    }</div>` +

    `<div class="cards">
      ${card("Wallet total", totals.wallet_total)}
      ${card("Ledger net", totals.ledger_net)}
      ${card("Commissions", totals.commissions)}
      ${card("Difference", totals.unrecorded)}
    </div>` +

    section("Reconciliation Checks", renderTable(rows, [
      ["check", "Check"],
      ["a", "Value A"],
      ["b", "Value B"],
      ["diff", "Difference"]
    ])) +

    section("Users with Balance Differences", renderTable(data.mismatches, [
      ["id", "User ID", userLink],
      ["username", "Username"],
      ["balance", "Balance"],
      ["expected", "Expected"],
      ["diff", "Difference"]
    ]));
}

function renderUser(data) {
  const profile = data.profile || {};
  const stats = data.stats || {};
  const tree = data.referral_tree || [];

  const levelCount = level =>
    tree.filter(user => Number(user.level) === level).length;

  $("#content").innerHTML =
    '<button id="backBtn">← Back</button>' +

    `<div class="cards">
      ${card("Username", profile.username || "-")}
      ${card("Telegram ID", profile.telegram_id || "-")}
      ${card("Balance", profile.balance)}
      ${card("Registered", profile.created_at ? dt(profile.created_at) : "-")}
    </div>` +

    `<div class="cards">
      ${card("Bets", stats.bets)}
      ${card("Total Stake", stats.stake)}
      ${card("Payouts", stats.payout)}
      ${card("Won / Lost", `${stats.wins || 0} / ${stats.losses || 0}`)}
    </div>` +

    `<div class="cards">
      ${card("Referral Code", profile.referral_code || "-")}
      ${card("Referred By", profile.referred_by || "-")}
      ${card("Referrals L1/L2/L3", `${levelCount(1)}/${levelCount(2)}/${levelCount(3)}`)}
      ${card("Commissions Generated", data.commissions_generated)}
    </div>` +

    section("Referral Tree", renderTable(tree, [
      ["level", "Level"],
      ["id", "User ID", userLink],
      ["username", "Username"],
      ["referred_by", "Parent", userLink],
      ["created_at", "Registered", dt]
    ])) +

    section("Commissions Earned", renderTable(data.commissions_earned, [
      ["referral_level", "Level"],
      ["count", "Count"],
      ["total", "Total"]
    ])) +

    section("Recent Bets", renderTable(data.recent_bets, [
      ["id", "ID"],
      ["round_code", "Round", roundLink],
      ["bet_type", "Type"],
      ["selection", "Selection"],
      ["stake", "Stake"],
      ["fee", "Fee"],
      ["status", "Status", badge],
      ["result_number", "Result"],
      ["payout", "Payout"],
      ["created_at", "Created", dt]
    ])) +

    section("Recent Transactions", renderTable(data.recent_transactions, [
      ["id", "ID"],
      ["transaction_type", "Type"],
      ["amount", "Amount"],
      ["status", "Status", badge],
      ["network", "Network"],
      ["tx_hash", "Transaction hash"],
      ["created_at", "Created", dt]
    ]));

  $("#backBtn").onclick = load;
}

function renderSearch(data, query) {
  $("#content").innerHTML =
    `<div class="note">Search results for: ${esc(query)}</div>` +
    section("Users", renderTable(data.users, [
      ["id", "User ID", userLink],
      ["telegram_id", "Telegram ID"],
      ["username", "Username"],
      ["balance", "Balance"]
    ])) +

    ((data.rounds || []).length
      ? section("Rounds", renderTable(data.rounds, [
          ["round_code", "Round", roundLink],
          ["status", "Status", badge],
          ["starts_at", "Starts", dt],
          ["ends_at", "Ends", dt]
        ]))
      : "") +

    ((data.bets || []).length
      ? section("Bets", renderTable(data.bets, [
          ["id", "Bet ID"],
          ["user_id", "User ID", userLink],
          ["round_code", "Round", roundLink],
          ["bet_type", "Type"],
          ["stake", "Stake"],
          ["status", "Status", badge]
        ]))
      : "");
}

function filterBar(view) {
  if (!view.filters) return "";

  const inputs = view.filters.map(filter => {
    if (filter.options) {
      return `
        <select data-filter="${esc(filter.name)}">
          <option value="">${esc(filter.placeholder)}</option>
          ${filter.options.map(option => `
            <option value="${esc(option)}"
              ${activeFilters[filter.name] === option ? "selected" : ""}>
              ${esc(option)}
            </option>
          `).join("")}
        </select>`;
    }

    return `
      <input data-filter="${esc(filter.name)}"
        placeholder="${esc(filter.placeholder)}"
        value="${esc(activeFilters[filter.name] || "")}">`;
  }).join("");

  return `
    <div class="filters">
      ${inputs}
      <button id="applyBtn" class="primary">Apply</button>
      <button id="resetBtn">Reset</button>
      ${view.exportKind ? '<button id="exportBtn">Export CSV</button>' : ""}
    </div>
    <p id="exportMsg" class="muted small"></p>`;
}

function downloadCsv(filename, csv) {
  const blob = new Blob(["\ufeff" + csv], {
    type: "text/csv;charset=utf-8"
  });

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

async function load() {
  const sequence = ++requestSequence;
  const view = VIEWS[currentView];

  $("#pageTitle").textContent = view.label;
  $("#pageSubtitle").textContent = view.subtitle || "Admin records";
  $("#content").innerHTML = '<div class="panel muted">Loading data…</div>';

  try {
    if (currentView === "dashboard") {
      const data = await api({action: "dashboard"});
      if (sequence !== requestSequence) return;
      renderDashboard(data);
      updateTime();
      return;
    }

    if (currentView === "analytics") {
      const data = await api({action: "analytics"});
      if (sequence !== requestSequence) return;
      renderAnalytics(data);
      updateTime();
      return;
    }

    if (currentView === "reconcile") {
      const data = await api({action: "reconcile"});
      if (sequence !== requestSequence) return;
      renderReconcile(data);
      updateTime();
      return;
    }

    const data = await api({
      action: view.action,
      page: currentPage,
      page_size: 20,
      ...(view.fixed || {}),
      ...activeFilters
    });

    if (sequence !== requestSequence) return;

    const pagination = data.pagination || {
      page: 1,
      total_pages: 1,
      total: 0,
      has_previous: false,
      has_next: false
    };

    $("#content").innerHTML =
      (view.note ? `<div class="note">${esc(view.note)}</div>` : "") +
      filterBar(view) +
      renderTable(data[view.key], view.cols) +
      `<div class="pager">
        <button id="prevBtn" ${pagination.has_previous ? "" : "disabled"}>← Previous</button>
        <span class="muted small">
          Page ${esc(pagination.page)} of ${esc(pagination.total_pages)}
          · ${esc(pagination.total)} records
        </span>
        <button id="nextBtn" ${pagination.has_next ? "" : "disabled"}>Next →</button>
      </div>`;

    const applyButton = $("#applyBtn");

    if (applyButton) {
      applyButton.onclick = () => {
        activeFilters = {};

        document.querySelectorAll("[data-filter]").forEach(element => {
          if (element.value.trim()) {
            activeFilters[element.dataset.filter] = element.value.trim();
          }
        });

        currentPage = 1;
        load();
      };
    }

    const resetButton = $("#resetBtn");

    if (resetButton) {
      resetButton.onclick = () => {
        activeFilters = {};
        currentPage = 1;
        load();
      };
    }

    const exportButton = $("#exportBtn");

    if (exportButton) {
      exportButton.onclick = async () => {
        exportButton.disabled = true;
        $("#exportMsg").textContent = "Preparing CSV…";

        try {
          const result = await api({
            action: "export",
            kind: view.exportKind,
            ...(view.fixed || {}),
            ...activeFilters
          });

          downloadCsv(
            `${view.exportKind}-${new Date().toISOString().slice(0, 10)}.csv`,
            result.csv || ""
          );

          $("#exportMsg").textContent =
            `${result.row_count || 0} records exported` +
            (result.truncated ? " (server limit applied)." : ".");
        } catch (error) {
          if (error.message !== "auth") {
            $("#exportMsg").textContent = error.message;
          }
        } finally {
          exportButton.disabled = false;
        }
      };
    }

    $("#prevBtn").onclick = () => {
      if (currentPage > 1) {
        currentPage--;
        load();
      }
    };

    $("#nextBtn").onclick = () => {
      if (pagination.has_next) {
        currentPage++;
        load();
      }
    };

    updateTime();

  } catch (error) {
    if (error.message !== "auth" && sequence === requestSequence) {
      $("#content").innerHTML =
        `<div class="note bad">${esc(error.message)}</div>`;
    }
  }
}

function updateTime() {
  $("#lastUpdated").textContent =
    "Updated " + new Date().toLocaleTimeString();
}

function buildNavigation() {
  $("#nav").innerHTML = Object.entries(VIEWS).map(([key, view]) => `
    <button type="button" data-view="${esc(key)}"
      class="${key === currentView ? "active" : ""}">
      ${esc(view.icon)} &nbsp; ${esc(view.label)}
    </button>
  `).join("");

  document.querySelectorAll("#nav [data-view]").forEach(button => {
    button.onclick = () => {
      currentView = button.dataset.view;
      currentPage = 1;
      activeFilters = {};
      buildNavigation();
      load();
    };
  });
}

async function openUser(id) {
  if (!/^\d{1,15}$/.test(String(id))) return;

  $("#content").innerHTML = '<div class="panel muted">Loading user…</div>';

  try {
    const data = await api({
      action: "user_detail",
      user_id: String(id)
    });

    renderUser(data);
    updateTime();
  } catch (error) {
    if (error.message !== "auth") {
      $("#content").innerHTML =
        `<div class="note bad">${esc(error.message)}</div>` +
        '<button id="backBtn">Back</button>';

      $("#backBtn").onclick = load;
    }
  }
}

async function runSearch() {
  const query = $("#globalSearch").value.trim();
  if (!query) return;

  $("#content").innerHTML = '<div class="panel muted">Searching…</div>';

  try {
    const data = await api({action: "search", q: query});
    renderSearch(data, query);
    updateTime();
  } catch (error) {
    if (error.message !== "auth") {
      $("#content").innerHTML =
        `<div class="note bad">${esc(error.message)}</div>`;
    }
  }
}

function showLogin(message = "") {
  $("#appView").classList.add("hide");
  $("#loginView").classList.remove("hide");
  $("#loginMsg").textContent = message;
  $("#password").value = "";
}

function showApp() {
  $("#loginView").classList.add("hide");
  $("#appView").classList.remove("hide");

  currentView = "dashboard";
  currentPage = 1;
  activeFilters = {};

  buildNavigation();
  load();
}

$("#content").addEventListener("click", event => {
  const target = event.target.closest("[data-user],[data-round]");
  if (!target) return;

  event.preventDefault();

  if (target.dataset.user) {
    openUser(target.dataset.user);
    return;
  }

  currentView = "bets";
  currentPage = 1;
  activeFilters = {round_code: target.dataset.round};

  buildNavigation();
  load();
});

$("#searchBtn").onclick = runSearch;

$("#globalSearch").addEventListener("keydown", event => {
  if (event.key === "Enter") runSearch();
});

$("#refreshBtn").onclick = load;

$("#loginForm").addEventListener("submit", async event => {
  event.preventDefault();

  const button = $("#loginBtn");
  button.disabled = true;
  $("#loginMsg").textContent = "";

  try {
    await api({
      action: "login",
      username: $("#username").value,
      password: $("#password").value
    });

    showApp();
  } catch (error) {
    $("#loginMsg").textContent =
      error.message === "auth" ? "" : error.message;
  } finally {
    button.disabled = false;
  }
});

$("#logoutBtn").onclick = async () => {
  try {
    await api({action: "logout"});
  } catch {}

  showLogin();
};

(async function initialize() {
  try {
    await api({action: "me"});
    showApp();
  } catch {
    showLogin();
  }
})();
</script>

</body>
</html>
