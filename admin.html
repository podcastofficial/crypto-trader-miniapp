<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Crypto Trader Pro | Admin Panel</title>

<style>
:root {
  --bg: #090909;
  --panel: #121212;
  --panel2: #181818;
  --border: #292929;
  --yellow: #ffd400;
  --yellow2: #e5bd00;
  --text: #f4f4f4;
  --muted: #999;
  --green: #20d49a;
  --red: #ff5268;
  --violet: #a78bfa;
  --blue: #65a9ff;
  --radius: 14px;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, system-ui, -apple-system, sans-serif;
  font-size: 14px;
}

button,
input,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.hidden {
  display: none !important;
}

.muted {
  color: var(--muted);
}

.small {
  font-size: 12px;
}

.green {
  color: var(--green);
}

.red {
  color: var(--red);
}

.yellow {
  color: var(--yellow);
}

.violet {
  color: var(--violet);
}

#loginView {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  background:
    radial-gradient(circle at 50% 0%, #292200 0, transparent 45%),
    var(--bg);
}

.login-card {
  width: 100%;
  max-width: 390px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 28px;
  box-shadow: 0 20px 80px #0008;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-icon {
  display: grid;
  place-items: center;
  width: 45px;
  height: 45px;
  border-radius: 13px;
  background: var(--yellow);
  color: #111;
  font-size: 23px;
  font-weight: 900;
}

.brand h1 {
  margin: 0;
  font-size: 18px;
}

.brand p {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 12px;
}

.login-card h2 {
  margin: 28px 0 6px;
  font-size: 24px;
}

.login-card > p {
  margin: 0 0 24px;
  color: var(--muted);
}

.field {
  display: flex;
  flex-direction: column;
  gap: 7px;
  margin-bottom: 16px;
}

.field label {
  color: #ccc;
  font-size: 12px;
}

input,
select {
  min-width: 0;
  width: 100%;
  padding: 11px 12px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: #0d0d0d;
  color: var(--text);
  outline: none;
}

input:focus,
select:focus {
  border-color: var(--yellow);
}

.btn {
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 9px;
  color: var(--text);
  background: var(--panel2);
  font-weight: 700;
}

.btn:hover {
  border-color: #666;
}

.btn-primary {
  background: var(--yellow);
  color: #111;
  border-color: var(--yellow);
}

.btn-primary:hover {
  background: var(--yellow2);
}

.btn-danger {
  color: var(--red);
  border-color: #61242d;
}

.btn-block {
  width: 100%;
}

.error {
  color: var(--red);
  font-size: 12px;
  margin-top: 12px;
  line-height: 1.5;
}

#appView {
  min-height: 100vh;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  min-height: 68px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  padding: 12px 22px;
  background: #101010ee;
  backdrop-filter: blur(15px);
  border-bottom: 1px solid var(--border);
}

.topbar .brand-icon {
  width: 38px;
  height: 38px;
  font-size: 19px;
}

.topbar .brand h1 {
  font-size: 15px;
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.admin-badge {
  color: var(--yellow);
  border: 1px solid #665500;
  background: #282100;
  border-radius: 20px;
  padding: 6px 10px;
  font-size: 11px;
  font-weight: 800;
}

.layout {
  display: grid;
  grid-template-columns: 225px minmax(0, 1fr);
  min-height: calc(100vh - 68px);
}

.sidebar {
  padding: 18px 12px;
  background: #0c0c0c;
  border-right: 1px solid var(--border);
}

.nav-label {
  margin: 14px 10px 8px;
  font-size: 10px;
  font-weight: 800;
  color: #707070;
  letter-spacing: 1.2px;
}

.nav-btn {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  text-align: left;
  padding: 11px 12px;
  margin: 3px 0;
  background: transparent;
  color: #aaa;
  border: 1px solid transparent;
  border-radius: 9px;
  font-size: 13px;
}

.nav-btn:hover {
  background: #181818;
  color: #fff;
}

.nav-btn.active {
  background: #292300;
  color: var(--yellow);
  border-color: #514500;
  font-weight: 800;
}

.nav-icon {
  width: 20px;
  text-align: center;
  font-size: 16px;
}

.main {
  min-width: 0;
  padding: 24px;
}

.page-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 22px;
}

.page-header h2 {
  margin: 0;
  font-size: 25px;
  letter-spacing: -.5px;
}

.page-header p {
  margin: 7px 0 0;
  color: var(--muted);
  line-height: 1.5;
}

.header-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.grid {
  display: grid;
  gap: 14px;
}

.stats-grid {
  grid-template-columns: repeat(4, minmax(0, 1fr));
  margin-bottom: 20px;
}

.stat-card,
.card {
  min-width: 0;
  padding: 17px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}

.stat-label {
  color: var(--muted);
  font-size: 12px;
  margin-bottom: 12px;
}

.stat-value {
  font-size: clamp(20px, 2vw, 28px);
  font-weight: 850;
  overflow-wrap: anywhere;
}

.stat-note {
  margin-top: 9px;
  font-size: 11px;
  color: var(--muted);
}

.card {
  margin-bottom: 18px;
}

.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 16px;
}

.card-head h3 {
  margin: 0;
  font-size: 15px;
}

.two-col {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px;
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin-bottom: 16px;
}

.toolbar > * {
  flex: 1 1 150px;
}

.table-wrap {
  width: 100%;
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: 10px;
}

table {
  border-collapse: collapse;
  width: 100%;
  min-width: 720px;
  font-size: 12px;
}

th,
td {
  padding: 12px;
  border-bottom: 1px solid #242424;
  text-align: left;
  vertical-align: top;
  white-space: nowrap;
}

th {
  background: #1a1a1a;
  color: #bbb;
  font-weight: 800;
  font-size: 11px;
}

td {
  color: #e0e0e0;
}

tbody tr:hover {
  background: #191919;
}

tbody tr:last-child td {
  border-bottom: 0;
}

.badge {
  display: inline-block;
  padding: 4px 8px;
  border-radius: 20px;
  font-size: 10px;
  font-weight: 800;
  background: #252525;
  color: #ccc;
}

.badge.success {
  background: #10382c;
  color: var(--green);
}

.badge.danger {
  background: #401a21;
  color: var(--red);
}

.badge.warning {
  background: #3a3008;
  color: var(--yellow);
}

.badge.info {
  background: #1a2b45;
  color: var(--blue);
}

.badge.violet {
  background: #302044;
  color: var(--violet);
}

.status-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}

.status-item {
  padding: 13px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: #0e0e0e;
}

.status-item span {
  display: block;
  color: var(--muted);
  font-size: 11px;
  margin-bottom: 8px;
}

.status-item strong {
  font-size: 17px;
  overflow-wrap: anywhere;
}

.pagination {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 14px;
}

.pagination-actions {
  display: flex;
  gap: 7px;
}

.notice {
  padding: 12px 14px;
  margin-bottom: 16px;
  border-radius: 9px;
  background: #171717;
  border: 1px solid var(--border);
  color: #bbb;
  line-height: 1.6;
}

.notice.warning {
  background: #211c08;
  border-color: #5a4b0b;
  color: #f0dc86;
}

.notice.danger {
  background: #291217;
  border-color: #5c2730;
  color: #ffb3bd;
}

.empty {
  padding: 35px 15px;
  text-align: center;
  color: var(--muted);
}

.loading {
  padding: 22px;
  text-align: center;
  color: var(--muted);
}

.toast {
  position: fixed;
  z-index: 100;
  right: 18px;
  bottom: 18px;
  max-width: calc(100vw - 36px);
  padding: 13px 16px;
  background: #202020;
  color: white;
  border: 1px solid #444;
  border-radius: 10px;
  box-shadow: 0 10px 40px #0008;
}

.toast.error-toast {
  border-color: #7b2935;
}

.chart-bars {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  min-height: 170px;
  overflow-x: auto;
  padding: 15px 5px 0;
}

.chart-col {
  flex: 1;
  min-width: 25px;
  text-align: center;
}

.chart-bar {
  min-height: 3px;
  border-radius: 5px 5px 0 0;
  background: var(--yellow);
  width: 100%;
}

.chart-label {
  margin-top: 7px;
  color: var(--muted);
  font-size: 10px;
}

.chart-number {
  font-size: 10px;
  margin-bottom: 5px;
}

.detail-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}

.detail-item {
  border: 1px solid var(--border);
  background: #0e0e0e;
  border-radius: 9px;
  padding: 12px;
  min-width: 0;
}

.detail-item span {
  display: block;
  color: var(--muted);
  font-size: 11px;
  margin-bottom: 7px;
}

.detail-item strong {
  overflow-wrap: anywhere;
}

pre {
  max-width: 100%;
  overflow: auto;
  color: #ddd;
  background: #0a0a0a;
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 13px;
  font-size: 12px;
}

@media (max-width: 1100px) {
  .stats-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .layout {
    grid-template-columns: 190px minmax(0, 1fr);
  }

  .main {
    padding: 18px;
  }
}

@media (max-width: 720px) {
  .topbar {
    padding: 10px 13px;
  }

  .topbar .brand p {
    display: none;
  }

  .layout {
    display: block;
  }

  .sidebar {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 9px;
    border-right: 0;
    border-bottom: 1px solid var(--border);
  }

  .nav-label {
    display: none;
  }

  .nav-btn {
    flex: 0 0 auto;
    width: auto;
    white-space: nowrap;
    margin: 0;
    padding: 10px;
  }

  .main {
    padding: 15px;
  }

  .page-header h2 {
    font-size: 22px;
  }

  .two-col {
    grid-template-columns: 1fr;
    gap: 0;
  }

  .status-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .detail-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 420px) {
  .stats-grid {
    grid-template-columns: 1fr 1fr;
    gap: 9px;
  }

  .stat-card {
    padding: 12px;
  }

  .stat-value {
    font-size: 19px;
  }

  .stat-label {
    font-size: 11px;
  }

  .topbar-right .admin-badge {
    display: none;
  }

  .status-grid,
  .detail-grid {
    grid-template-columns: 1fr 1fr;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->

<section id="loginView">
  <div class="login-card">
    <div class="brand">
      <div class="brand-icon">₿</div>
      <div>
        <h1>CRYPTO TRADER PRO</h1>
        <p>Secure Administration</p>
      </div>
    </div>

    <h2>Admin Login</h2>
    <p>Sign in to manage and monitor your platform.</p>

    <form id="loginForm">
      <div class="field">
        <label for="loginUsername">Username</label>
        <input
          id="loginUsername"
          name="username"
          autocomplete="username"
          required
          maxlength="200"
        >
      </div>

      <div class="field">
        <label for="loginPassword">Password</label>
        <input
          id="loginPassword"
          name="password"
          type="password"
          autocomplete="current-password"
          required
          maxlength="500"
        >
      </div>

      <button
        class="btn btn-primary btn-block"
        id="loginButton"
        type="submit"
      >
        Sign In Securely
      </button>

      <div id="loginError" class="error"></div>
    </form>

    <p class="small muted" style="margin-top:22px">
      Authorized administrators only.
    </p>
  </div>
</section>

<!-- APPLICATION -->

<section id="appView" class="hidden">

  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">₿</div>
      <div>
        <h1>CRYPTO TRADER PRO</h1>
        <p>Administration Dashboard</p>
      </div>
    </div>

    <div class="topbar-right">
      <span class="admin-badge">ADMIN</span>
      <span id="adminUsername" class="small muted"></span>
      <button class="btn btn-danger" id="logoutButton">
        Logout
      </button>
    </div>
  </header>

  <div class="layout">

    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
      <div id="pageContent">
        <div class="loading">Loading dashboard...</div>
      </div>
    </main>

  </div>
</section>

<div id="toast" class="toast hidden" role="status"></div>

<script>
"use strict";

const API_URL = "/api/admin";

const VIEWS = [
  {
    group: "OVERVIEW",
    items: [
      ["dashboard", "▦", "Dashboard"],
      ["analytics", "◫", "Analytics"],
      ["reconcile", "⇄", "Reconciliation"]
    ]
  },
  {
    group: "PLATFORM",
    items: [
      ["users", "♙", "Users"],
      ["wallets", "◈", "Wallets"],
      ["transactions", "⇄", "Transactions"],
      ["deposits", "↓", "Deposits"],
      ["withdrawals", "↑", "Withdrawals"],
      ["rounds", "◷", "Game Rounds"],
      ["bets", "♠", "Bets"],
      ["referrals", "♧", "Referrals"]
    ]
  },
  {
    group: "SECURITY",
    items: [
      ["audit", "▤", "Audit Logs"],
      ["login_attempts", "⌁", "Login Attempts"],
      ["search", "⌕", "Global Search"]
    ]
  }
];

const state = {
  username: "",
  currentView: "dashboard",
  pages: {},
  filters: {},
  userDetailId: null,
  busy: false
};

const $ = id => document.getElementById(id);

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function formatNumber(value, decimals = 2) {
  if (value === null || value === undefined || value === "") {
    return "—";
  }

  const n = Number(value);

  if (!Number.isFinite(n)) {
    return String(value);
  }

  return n.toLocaleString("en-US", {
    maximumFractionDigits: decimals
  });
}

function formatDate(value) {
  if (!value) return "—";

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) {
    return String(value);
  }

  return date.toLocaleString("en-IN", {
    dateStyle: "medium",
    timeStyle: "short",
    hour12: true
  });
}

function money(value) {
  return formatNumber(value, 4);
}

function badge(value) {
  const text = String(value ?? "unknown");
  let cls = "";

  if (
    ["completed", "confirmed", "settled", "won", "success"]
      .includes(text.toLowerCase())
  ) {
    cls = "success";
  } else if (
    ["failed", "rejected", "lost", "cancelled", "error"]
      .includes(text.toLowerCase())
  ) {
    cls = "danger";
  } else if (
    ["pending", "open", "locked"].includes(text.toLowerCase())
  ) {
    cls = "warning";
  } else if (
    ["active", "info"].includes(text.toLowerCase())
  ) {
    cls = "info";
  }

  return `<span class="badge ${cls}">${escapeHtml(text)}</span>`;
}

function toast(message, isError = false) {
  const el = $("toast");

  el.textContent = message;
  el.className = "toast" + (isError ? " error-toast" : "");

  clearTimeout(toast.timer);

  toast.timer = setTimeout(() => {
    el.classList.add("hidden");
  }, 3500);
}

async function api(action, data = {}) {
  const response = await fetch(API_URL, {
    method: "POST",
    credentials: "same-origin",
    headers: {
      "Content-Type": "application/json",
      "X-Admin-Request": "1"
    },
    body: JSON.stringify({
      action,
      ...data
    })
  });

  let result;

  try {
    result = await response.json();
  } catch {
    throw new Error("Server returned an invalid response.");
  }

  if (response.status === 401) {
    showLogin("Your session expired. Please sign in again.");
    throw new Error(result.error || "Session expired.");
  }

  if (!response.ok || result.ok === false) {
    throw new Error(result.error || "Request failed.");
  }

  return result;
}

function showLogin(message = "") {
  $("appView").classList.add("hidden");
  $("loginView").classList.remove("hidden");
  $("loginError").textContent = message;
  $("loginPassword").value = "";
  state.username = "";
}

function showApp(username) {
  state.username = username || "Admin";

  $("adminUsername").textContent = state.username;
  $("loginView").classList.add("hidden");
  $("appView").classList.remove("hidden");

  renderNavigation();
  navigate("dashboard");
}

function renderNavigation() {
  const sidebar = $("sidebar");

  sidebar.innerHTML = VIEWS.map(group => `
    <div class="nav-label">${escapeHtml(group.group)}</div>
    ${group.items.map(item => `
      <button
        class="nav-btn ${state.currentView === item[0] ? "active" : ""}"
        data-view="${escapeHtml(item[0])}"
      >
        <span class="nav-icon">${item[1]}</span>
        <span>${escapeHtml(item[2])}</span>
      </button>
    `).join("")}
  `).join("");

  sidebar.querySelectorAll("[data-view]").forEach(button => {
    button.addEventListener("click", () => {
      navigate(button.dataset.view);
    });
  });
}

function setPage(title, description, actions = "") {
  $("pageContent").innerHTML = `
    <div class="page-header">
      <div>
        <h2>${escapeHtml(title)}</h2>
        <p>${escapeHtml(description)}</p>
      </div>
      <div class="header-actions">${actions}</div>
    </div>
    <div id="viewBody">
      <div class="loading">Loading data...</div>
    </div>
  `;
}

function metricCard(label, value, note = "", color = "") {
  return `
    <div class="stat-card">
      <div class="stat-label">${escapeHtml(label)}</div>
      <div class="stat-value ${color}">${escapeHtml(value)}</div>
      <div class="stat-note">${escapeHtml(note)}</div>
    </div>
  `;
}

function table(headers, rows, emptyText = "No records found.") {
  if (!rows || !rows.length) {
    return `<div class="empty">${escapeHtml(emptyText)}</div>`;
  }

  return `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>${headers.map(h => `<th>${escapeHtml(h)}</th>`).join("")}</tr>
        </thead>
        <tbody>
          ${rows.map(row => `
            <tr>${row.map(cell => `<td>${cell ?? "—"}</td>`).join("")}</tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `;
}

function detailItem(label, value) {
  return `
    <div class="detail-item">
      <span>${escapeHtml(label)}</span>
      <strong>${escapeHtml(value ?? "—")}</strong>
    </div>
  `;
}

function statValue(value, decimals = 2) {
  return formatNumber(value ?? 0, decimals);
}

async function navigate(view) {
  state.currentView = view;
  state.pages[view] = state.pages[view] || 1;

  renderNavigation();

  try {
    switch (view) {
      case "dashboard":
        await renderDashboard();
        break;

      case "analytics":
        await renderAnalytics();
        break;

      case "reconcile":
        await renderReconcile();
        break;

      case "transactions":

      case "withdrawals":
        await renderTransactions("withdrawals");
        break;

      case "rounds":
        await renderRounds();
        break;

      case "bets":
        await renderBets();
        break;

      case "referrals":
        await renderReferrals();
        break;

      case "audit":
        await renderAudit();
        break;

      case "login_attempts":
        await renderLoginAttempts();
        break;

      case "search":
        renderSearch();
        break;

      default:
        setPage("Not Found", "Unknown dashboard section.");
        $("viewBody").innerHTML =
          '<div class="empty">This section is unavailable.</div>';
    }
  } catch (error) {
    if (view === state.currentView) {
      $("pageContent").innerHTML = `
        <div class="page-header">
          <div>
            <h2>${escapeHtml(viewLabel(view))}</h2>
            <p>Unable to load this section.</p>
          </div>
          <button class="btn" id="retryButton">Retry</button>
        </div>
        <div class="notice danger">${escapeHtml(error.message)}</div>
      `;

      $("retryButton").addEventListener("click", () => navigate(view));
    }
  }
}

function viewLabel(view) {
  for (const group of VIEWS) {
    for (const item of group.items) {
      if (item[0] === view) return item[2];
    }
  }

  return view;
}

            .map(s => `<option value="${s}">${s}</option>`).join("")}

function getFilters(view) {
  const saved = state.filters[view] || {};

  return {
    q: $("filterQ") ? $("filterQ").value.trim() : (saved.q || ""),
    segment: $("filterSegment") ? $("filterSegment").value : (saved.segment || "all"),
    type: $("filterType") ? $("filterType").value : (saved.type || ""),
    status: $("filterStatus") ? $("filterStatus").value : (saved.status || ""),
    user_id: $("filterUserId") ? $("filterUserId").value.trim() : (saved.user_id || "")
  };
}

function restoreFilters(view) {
  const f = state.filters[view] || {};

  if ($("filterQ")) $("filterQ").value = f.q || "";
  if ($("filterSegment")) $("filterSegment").value = f.segment || "all";
  if ($("filterType")) $("filterType").value = f.type || "";
  if ($("filterStatus")) $("filterStatus").value = f.status || "";
  if ($("filterUserId")) $("filterUserId").value = f.user_id || "";
}

function attachFilterActions(view, renderFunction) {
  restoreFilters(view);

  $("applyFilters").addEventListener("click", () => {
    state.filters[view] = getFilters(view);
    state.pages[view] = 1;
    renderFunction();
  });

  $("clearFilters").addEventListener("click", () => {
    state.filters[view] = {};
    state.pages[view] = 1;
    renderFunction();
  });

  const search = $("filterQ");

  if (search) {
    search.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        state.filters[view] = getFilters(view);
        state.pages[view] = 1;
        renderFunction();
      }
    });
  }
}

function paginationHtml(info) {
  if (!info) return "";

  return `
    <div class="pagination">
      <span class="small muted">
        Page ${escapeHtml(info.page)} of ${escapeHtml(info.total_pages)}
        · ${escapeHtml(info.total)} records
      </span>
      <div class="pagination-actions">
        <button class="btn" id="previousPage" ${info.has_previous ? "" : "disabled"}>← Previous</button>
        <button class="btn" id="nextPage" ${info.has_next ? "" : "disabled"}>Next →</button>
      </div>
    </div>
  `;
}

function attachPagination(view, info, renderFunction) {
  if (!info) return;

  if ($("previousPage")) {
    $("previousPage").addEventListener("click", () => {
      state.pages[view] = Math.max(1, (state.pages[view] || 1) - 1);
      renderFunction();
    });
  }

  if ($("nextPage")) {
    $("nextPage").addEventListener("click", () => {
      state.pages[view] = (state.pages[view] || 1) + 1;
      renderFunction();
    });
  }
}

async function downloadCsv(dataset, filters = {}) {
  const data = await api("export", {
    dataset,
    ...filters
  });

  if (!data.csv) {
    toast("No rows available to export.");
    return;
  }

  const blob = new Blob(["\uFEFF", data.csv], {
    type: "text/csv;charset=utf-8"
  });

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = `crypto-trader-${dataset}-${new Date().toISOString().slice(0, 10)}.csv`;

  document.body.appendChild(link);
  link.click();
  link.remove();

  URL.revokeObjectURL(url);

  toast(
    `Exported ${data.row_count} rows` +
    (data.truncated ? ". Export limit reached." : ".")
  );
}

    : view === "withdrawals"
      ? "Withdrawals"
      : "Transactions";

  setPage(
    title,
    "Read-only transaction records. Approval actions are not enabled.",
    '<button class="btn" id="exportTransactions">Export CSV</button>'
  );

  $("viewBody").innerHTML = filterToolbar({
    type: view === "transactions",
    status: true,
    userId: true
  });

  attachFilterActions(view, () => renderTransactions(view));

  const f = state.filters[view] || {};

  let type = f.type || "";

  if (view === "deposits") type = "deposit";
  if (view === "withdrawals") type = "withdrawal";

  const data = await api("transactions", {
    page: state.pages[view] || 1,
    page_size: 20,
    type,
    status: f.status || "",
    user_id: f.user_id || ""
  });

  $("viewBody").innerHTML = `
    ${filterToolbar({
      type: view === "transactions",
      status: true,
      userId: true
    })}
    <div class="notice warning">
      This page is read-only. It does not approve or reject transactions.
    </div>
    ${table(
      ["ID", "User ID", "Type", "Amount", "Status", "Network", "Transaction Hash", "Created", "Updated"],
      (data.transactions || []).map(t => [
        escapeHtml(t.id),
        escapeHtml(t.user_id),
        badge(t.transaction_type),
        escapeHtml(money(t.amount)),
        badge(t.status),
        escapeHtml(t.network || "—"),
        escapeHtml(t.tx_hash || "—"),
        escapeHtml(formatDate(t.created_at)),
        escapeHtml(formatDate(t.updated_at))
      ])
    )}
    ${paginationHtml(data.pagination)}
  `;

  attachFilterActions(view, () => renderTransactions(view));
  attachPagination(view, data.pagination, () => renderTransactions(view));

  $("exportTransactions").addEventListener("click", async () => {
    try {
      await downloadCsv("transactions", {
        ...state.filters[view],
        type
      });
    } catch (error) {
      toast(error.message, true);
    }
  });
}

function renderSearch() {
  setPage(
    "Global Search",
    "Search users, game rounds and bets using a username, numeric ID or round code."
  );

  $("viewBody").innerHTML = `
    <div class="card">
      <form id="globalSearchForm">
        <div class="toolbar">
          <input id="globalSearchInput" placeholder="Username, user ID, Telegram ID or round code" maxlength="100" required>
          <button class="btn btn-primary" type="submit">Search</button>
        </div>
      </form>
      <div id="searchResults"></div>
    </div>
  `;

  $("globalSearchForm").addEventListener("submit", async event => {
    event.preventDefault();

    const q = $("globalSearchInput").value.trim();

    if (!q) return;

    const container = $("searchResults");
    container.innerHTML = '<div class="loading">Searching...</div>';

    try {
      const data = await api("search", {q});

      container.innerHTML = `
        <div class="card-head"><h3>Users</h3></div>
        ${table(
          ["ID", "Telegram ID", "Username", "Balance", "Joined"],
          (data.users || []).map(u => [
            escapeHtml(u.id),
            escapeHtml(u.telegram_id),
            escapeHtml(u.username || "—"),
            escapeHtml(money(u.balance)),
            escapeHtml(formatDate(u.created_at))
          ])
        )}

        <div class="card-head" style="margin-top:22px"><h3>Rounds</h3></div>
        ${table(
          ["ID", "Round Code", "Status", "Start", "End", "Result"],
          (data.rounds || []).map(r => [
            escapeHtml(r.id),
            escapeHtml(r.round_code),
            badge(r.status),
            escapeHtml(formatDate(r.starts_at)),
            escapeHtml(formatDate(r.ends_at)),
            escapeHtml(r.result_number ?? "—")
          ])
        )}

        <div class="card-head" style="margin-top:22px"><h3>Bets</h3></div>
        ${table(
          ["ID", "User ID", "Round", "Type", "Stake", "Status", "Payout", "Created"],
          (data.bets || []).map(b => [
            escapeHtml(b.id),
            escapeHtml(b.user_id),
            escapeHtml(b.round_code || "—"),
            escapeHtml(b.bet_type),
            escapeHtml(money(b.stake)),
            badge(b.status),
            escapeHtml(money(b.payout)),
            escapeHtml(formatDate(b.created_at))
          ])
        )}
      `;
    } catch (error) {
      container.innerHTML = `<div class="notice danger">${escapeHtml(error.message)}</div>`;
    }
  });
}

/*
 * LOGIN FORM
 */

$("loginForm").addEventListener("submit", async event => {
  event.preventDefault();

  if (state.busy) return;

  state.busy = true;
  $("loginButton").disabled = true;
  $("loginButton").textContent = "Signing In...";
  $("loginError").textContent = "";

  try {
    const username = $("loginUsername").value.trim();
    const password = $("loginPassword").value;

    const result = await api("login", {
      username,
      password
    });

    $("loginPassword").value = "";

    showApp(result.username || username);
  } catch (error) {
    $("loginError").textContent = error.message;
  } finally {
    state.busy = false;
    $("loginButton").disabled = false;
    $("loginButton").textContent = "Sign In Securely";
  }
});

/*
 * LOGOUT
 */

$("logoutButton").addEventListener("click", async () => {
  if (!confirm("Are you sure you want to log out?")) return;

  try {
    await api("logout");
  } catch (error) {
    // Clear the local UI even if the session already expired.
  }

  showLogin("You have been logged out.");
});

/*
 * INITIAL SESSION CHECK
 */

(async function init() {
  try {
    const result = await api("me");

    if (result.username) {
      showApp(result.username);
    } else {
      showLogin();
    }
  } catch (error) {
    showLogin();
  }
})();
</script>
