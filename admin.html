function renderUser(d){const p=d.profile||{},s=d.stats||{},tree=d.referral_tree||[],lvl=n=>tree.filter(x=>Number(x.level)===n).length,u=d.activity||{},rr=d.referral_rewards||{};$("#content").innerHTML='<button id="backBtn">← Back to users</button>'+`<div class="cards">${card("Username",p.username||"-")}${card("Telegram ID",p.telegram_id||"-")}${card("Balance",fmt(p.balance))}${card("Registered",dt(p.created_at))}</div><div class="cards">${card("Total bets",fmt(s.bets))}${card("Total stake",fmt(s.stake))}${card("Payouts",fmt(s.payout))}${card("Won / lost",`${s.wins||0} / ${s.losses||0}`)}</div><div class="cards">${card("Referral code",p.referral_code||"-")}${card("Referred by",p.referred_by||"-")}${card("Referral tree L1/L2/L3",`${lvl(1)}/${lvl(2)}/${lvl(3)}`)}${card("Last bet",dt(u.last_bet_at))}</div><div class="cards">${card("Bets · 24h",fmt(u.bets_24h))}${card("Bets · 7 days",fmt(u.bets_7d))}${card("Commissions generated",fmt(d.commissions_generated))}${card("Referral rewards",`${fmt(rr.total)} records · ${fmt(rr.points)} points`)}</div>`+section("Referral Tree",table(tree,[["level","Level"],["id","User ID",userLink],["username","Username"],["referred_by","Parent",userLink],["created_at","Registered",dt]]))+section("Commissions Earned",table(d.commissions_earned,[["referral_level","Level"],["count","Count"],["total","Total"]]))+section("Recent Bets",table(d.recent_bets,[["id","ID"],["round_code","Round",roundLink],["bet_type","Type"],["selection","Selection"],["stake","Stake"],["fee","Fee"],["status","Status",badge],["result_number","Result"],["payout","Payout"],["created_at","Created",dt]]))+section("Recent Transactions",table(d.recent_transactions,[["id","ID"],["transaction_type","Type"],["amount","Amount"],["status","Status",badge],["network","Network"],["tx_hash","Transaction hash"],["created_at","Created",dt]]));$("#backBtn").onclick=()=>{detailMode=false;currentView="users";buildNav();load()}}

function filterBar(v){if(!v.filters)return "";return `<div class="filters">${v.filters.map(f=>f.options?`<select data-filter="${esc(f.name)}"><option value="">${esc(f.placeholder)}</option>${f.options.map(o=>`<option value="${esc(o)}" ${activeFilters[f.name]===o?"selected":""}>${esc(o.replaceAll("_"," "))}</option>`).join("")}</select>`:`<input data-filter="${esc(f.name)}" placeholder="${esc(f.placeholder)}" value="${esc(activeFilters[f.name]||"")}">`).join("")}<button id="applyBtn" class="primary">Apply</button><button id="resetBtn">Reset</button>${v.exportKind?'<button id="exportBtn">Export CSV</button>':""}</div><p id="exportMsg" class="muted small"></p>`}
function downloadCsv(name,csv){const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}function updateTime(){$("#lastUpdated").textContent="Updated "+new Date().toLocaleTimeString()}
async function load(){const seq=++requestSequence,v=VIEWS[currentView];if(!v)return;$("#pageTitle").textContent=v.label;$("#pageSubtitle").textContent=v.subtitle||"Admin records";$("#content").innerHTML='<div class="panel muted">Loading data…</div>';try{if(currentView==="dashboard"){const d=await api({action:"dashboard"});if(seq!==requestSequence)return;renderDashboard(d);updateTime();return}if(currentView==="analytics"){const d=await api({action:"analytics"});if(seq!==requestSequence)return;renderAnalytics(d);updateTime();return}if(currentView==="reconcile"){const d=await api({action:"reconcile"});if(seq!==requestSequence)return;renderReconcile(d);updateTime();return}if(currentView==="security"){const d=await api({action:"security"});if(seq!==requestSequence)return;$("#content").innerHTML=section("Login Attempts",table(d.attempts,[["id","ID"],["ip","IP"],["success","Success",yn],["attempted_at","Time",dt]]))+section("Recent Admin Audit",table(d.entries,[["id","ID"],["created_at","Time",dt],["admin_username","Admin"],["action","Action"],["target_type","Target"],["target_id","Target ID"],["outcome","Outcome",badge],["ip","IP"]]));updateTime();return}const d=await api({action:v.action,page:currentPage,page_size:20,...(v.fixed||{}),...activeFilters});if(seq!==requestSequence)return;const p=d.pagination||{page:1,total_pages:1,total:0,has_previous:false,has_next:false};$("#content").innerHTML+("");$("#content").innerHTML=(v.note?`<div class="note">${esc(v.note)}</div>`:"")+filterBar(v)+table(d[v.key],v.cols)+`<div class="pager"><button id="prevBtn" ${p.has_previous?"":"disabled"}>← Previous</button><span class="muted small">Page ${esc(p.page)} of ${esc(p.total_pages)} · ${esc(p.total)} records</span><button id="nextBtn" ${p.has_next?"":"disabled"}>Next →</button></div>`;if($("#applyBtn"))$("#applyBtn").onclick=()=>{activeFilters={};document.querySelectorAll("[data-filter]").forEach(e=>{if(e.value.trim())activeFilters[e.dataset.filter]=e.value.trim()});currentPage=1;load()};if($("#resetBtn"))$("#resetBtn").onclick=()=>{activeFilters={};currentPage=1;load()};if($("#exportBtn"))$("#exportBtn").onclick=async()=>{const b=$("#exportBtn");b.disabled=true;$("#exportMsg").textContent="Preparing CSV…";try{const r=await api({action:"export",kind:v.exportKind,...(v.fixed||{}),...activeFilters});downloadCsv(`${v.exportKind}-${new Date().toISOString().slice(0,10)}.csv`,r.csv||"");$("#exportMsg").textContent=`${r.row_count||0} records exported${r.truncated?" (server limit applied)":""}.`}catch(e){if(e.message!=="auth")$("#exportMsg").textContent=e.message}finally{b.disabled=false}};$("#prevBtn").onclick=()=>{if(p.has_previous){currentPage--;load()}};$("#nextBtn").onclick=()=>{if(p.has_next){currentPage++;load()}};updateTime()}catch(e){if(e.message!=="auth"&&seq===requestSequence)$("#content").innerHTML=`<div class="note bad">${esc(e.message)}</div>`}}
function buildNav(){$("#nav").innerHTML=Object.entries(VIEWS).map(([k,v])=>`<button type="button" data-view="${esc(k)}" class="${k===currentView?"active":""}">${esc(v.icon)} &nbsp; ${esc(v.label)}</button>`).join("");document.querySelectorAll("#nav [data-view]").forEach(b=>b.onclick=()=>{currentView=b.dataset.view;currentPage=1;activeFilters={};detailMode=false;buildNav();load()})}
async function openUser(id){if(!/^\d{1,15}$/.test(String(id)))return;$("#content").innerHTML='<div class="panel muted">Loading user…</div>';try{const d=await api({action:"user_detail",user_id:String(id)});detailMode=true;renderUser(d);updateTime()}catch(e){if(e.message!=="auth")$("#content").innerHTML=`<div class="note bad">${esc(e.message)}</div><button id="backBtn">Back</button>`;if($("#backBtn"))$("#backBtn").onclick=load}}
async function runSearch(){const q=$("#globalSearch").value.trim();if(!q)return;$("#content").innerHTML='<div class="panel muted">Searching…</div>';try{renderSearch(await api({action:"search",q}),q);updateTime()}catch(e){if(e.message!=="auth")$("#content").innerHTML=`<div class="note bad">${esc(e.message)}</div>`}}
function showLogin(msg=""){$("#appView").classList.add("hide");$("#loginView").classList.remove("hide");$("#loginMsg").textContent=msg;$("#password").value=""}function showApp(){$("#loginView").classList.add("hide");$("#appView").classList.remove("hide");currentView="dashboard";currentPage=1;activeFilters={};buildNav();load()}
$("#content").addEventListener("click",e=>{const t=e.target.closest("[data-user],[data-round],[data-segment]");if(!t)return;if(t.dataset.user){e.preventDefault();openUser(t.dataset.user);return}if(t.dataset.round){e.preventDefault();currentView="bets";currentPage=1;activeFilters={round_code:t.dataset.round};buildNav();load();return}if(t.dataset.segment){currentView="users";currentPage=1;activeFilters={segment:t.dataset.segment};buildNav();load()}});$("#searchBtn").onclick=runSearch;$("#globalSearch").addEventListener("keydown",e=>{if(e.key==="Enter")runSearch()});$("#refreshBtn").onclick=load;$("#loginForm").addEventListener("submit",async e=>{e.preventDefault();const b=$("#loginBtn");b.disabled=true;$("#loginMsg").textContent="";try{await api({action:"login",username:$("#username").value,password:$("#password").value});showApp()}catch(err){$("#loginMsg").textContent=err.message==="auth"?"":err.message}finally{b.disabled=false}});$("#logoutBtn").onclick=async()=>{try{await api({action:"logout"})}catch{}showLogin()};(async()=>{try{await api({action:"me"});showApp()}catch{showLogin()}})();
</script></body></html>
