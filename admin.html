<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Crypto Trader Pro | Admin Panel</title>

<style>
:root {
  --bg: #090909;
  --panel: #121212;
  --panel2: #181818;
  --border: #292929;
  --yellow: #ffd400;
  --yellow2: #e5bd00;
  --text: #f4f4f4;
  --muted: #999;
  --green: #20d49a;
  --red: #ff5268;
  --violet: #a78bfa;
  --blue: #65a9ff;
  --radius: 14px;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, system-ui, -apple-system, sans-serif;
  font-size: 14px;
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.hidden {
  display: none !important;
}

.muted {
  color: var(--muted);
}

.small {
  font-size: 12px;
}

.green {
  color: var(--green);
}

.red {
  color: var(--red);
}

.yellow {
  color: var(--yellow);
}

.violet {
  color: var(--violet);
}

/* =========================================
   LOGIN SCREEN
========================================= */
#loginView {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  background:
    radial-gradient(circle at 50% 0%, #292200 0, transparent 45%),
    var(--bg);
}

.login-card {
  width: 100%;
  max-width: 390px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 28px;
  box-shadow: 0 20px 80px #0008;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-icon {
  display: grid;
  place-items: center;
  width: 45px;
  height: 45px;
  border-radius: 13px;
  background: var(--yellow);
  color: #111;
  font-size: 23px;
  font-weight: 900;
}

.brand h1 {
  margin: 0;
  font-size: 18px;
}

.brand p {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 12px;
}

.login-card h2 {
  margin: 28px 0 6px;
  font-size: 24px;
}

.login-card > p {
  margin: 0 0 24px;
  color: var(--muted);
}

.field {
  display: flex;
  flex-direction: column;
  gap: 7px;
  margin-bottom: 16px;
}

.field label {
  color: #ccc;
  font-size: 12px;
}

input,
select,
textarea {
  min-width: 0;
  width: 100%;
  padding: 11px 12px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: #0d0d0d;
  color: var(--text);
  outline: none;
}

input:focus,
select:focus,
textarea:focus {
  border-color: var(--yellow);
}

textarea {
  resize: vertical;
  min-height: 100px;
  font-family: monospace;
}

.btn {
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 9px;
  color: var(--text);
  background: var(--panel2);
  font-weight: 700;
}

.btn:hover {
  border-color: #666;
}

.btn-primary {
  background: var(--yellow);
  color: #111;
  border-color: var(--yellow);
}

.btn-primary:hover {
  background: var(--yellow2);
}

.btn-danger {
  color: var(--red);
  border-color: #61242d;
  background: #2a1216;
}

.btn-danger:hover {
  background: #3a181d;
}

.btn-block {
  width: 100%;
}

.error {
  color: var(--red);
  font-size: 12px;
  margin-top: 12px;
  line-height: 1.5;
}

/* =========================================
   APP LAYOUT & TOPBAR
========================================= */
#appView {
  min-height: 100vh;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  min-height: 68px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  padding: 12px 22px;
  background: #101010ee;
  backdrop-filter: blur(15px);
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}

.topbar .brand-icon {
  width: 38px;
  height: 38px;
  font-size: 19px;
}

.topbar .brand h1 {
  font-size: 15px;
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.admin-badge {
  color: var(--yellow);
  border: 1px solid #665500;
  background: #282100;
  border-radius: 20px;
  padding: 6px 10px;
  font-size: 11px;
  font-weight: 800;
}

/* LIVE TIMER WIDGET */
.live-widget {
  background: #1a1a1c;
  border: 1px solid #333;
  border-radius: 12px;
  padding: 6px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-variant-numeric: tabular-nums;
  box-shadow: 0 4px 12px #0004;
}

.live-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 8px var(--green);
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0% { transform: scale(0.95); opacity: 1; }
  50% { transform: scale(1.1); opacity: 0.7; }
  100% { transform: scale(0.95); opacity: 1; }
}

.live-period {
  font-weight: 800;
  color: var(--yellow);
  font-size: 13px;
}

.live-timer {
  font-weight: 800;
  color: #fff;
  font-size: 15px;
  letter-spacing: 0.5px;
}

.live-timer.locked {
  color: var(--red);
}

/* NOTIFICATIONS */
.notif-btn {
  position: relative;
  background: transparent;
  border: none;
  font-size: 20px;
  color: var(--text);
  cursor: pointer;
  padding: 8px;
  border-radius: 50%;
  transition: background 0.2s;
}

.notif-btn:hover {
  background: rgba(255,255,255,0.1);
}

.notif-badge {
  position: absolute;
  top: 2px;
  right: 2px;
  background: var(--red);
  color: white;
  font-size: 10px;
  font-weight: bold;
  border-radius: 50%;
  padding: 2px 6px;
  border: 2px solid #101010;
}

.notif-dropdown {
  position: absolute;
  top: 70px;
  right: 22px;
  width: 320px;
  max-height: 400px;
  overflow-y: auto;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.8);
  z-index: 100;
}

.notif-header {
  padding: 12px 15px;
  border-bottom: 1px solid var(--border);
  font-weight: bold;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #1d1d1f;
  border-radius: 12px 12px 0 0;
}

.notif-item {
  padding: 12px 15px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}

.notif-item:last-child {
  border-bottom: none;
}

.notif-item:hover {
  background: #1a1a1c;
}

/* SIDEBAR & MAIN */
.layout {
  display: grid;
  grid-template-columns: 235px minmax(0, 1fr);
  min-height: calc(100vh - 68px);
}

.sidebar {
  padding: 18px 12px;
  background: #0c0c0c;
  border-right: 1px solid var(--border);
}

.nav-label {
  margin: 14px 10px 8px;
  font-size: 10px;
  font-weight: 800;
  color: #707070;
  letter-spacing: 1.2px;
}

.nav-btn {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  text-align: left;
  padding: 11px 12px;
  margin: 3px 0;
  background: transparent;
  color: #aaa;
  border: 1px solid transparent;
  border-radius: 9px;
  font-size: 13px;
  transition: all 0.2s;
}

.nav-btn:hover {
  background: #181818;
  color: #fff;
}

.nav-btn.active {
  background: #292300;
  color: var(--yellow);
  border-color: #514500;
  font-weight: 800;
  box-shadow: inset 3px 0 0 var(--yellow);
}

.nav-icon {
  width: 20px;
  text-align: center;
  font-size: 16px;
}

.main {
  min-width: 0;
  padding: 24px;
}

.page-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 22px;
}

.page-header h2 {
  margin: 0;
  font-size: 25px;
  letter-spacing: -.5px;
}

.page-header p {
  margin: 7px 0 0;
  color: var(--muted);
  line-height: 1.5;
}

.header-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

/* CARDS & GRIDS */
.grid {
  display: grid;
  gap: 14px;
}

.stats-grid {
  grid-template-columns: repeat(4, minmax(0, 1fr));
  margin-bottom: 20px;
}

.stat-card,
.card {
  min-width: 0;
  padding: 17px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: 0 8px 24px #0004;
}

.stat-label {
  color: var(--muted);
  font-size: 12px;
  margin-bottom: 12px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-weight: bold;
}

.stat-value {
  font-size: clamp(20px, 2vw, 28px);
  font-weight: 850;
  overflow-wrap: anywhere;
}

.stat-note {
  margin-top: 9px;
  font-size: 11px;
  color: var(--muted);
}

.card {
  margin-bottom: 18px;
}

.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 16px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 12px;
}

.card-head h3 {
  margin: 0;
  font-size: 15px;
}

/* TABLES */
.table-wrap {
  width: 100%;
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: 10px;
}

table {
  border-collapse: collapse;
  width: 100%;
  min-width: 720px;
  font-size: 12px;
}

th,
td {
  padding: 12px;
  border-bottom: 1px solid #242424;
  text-align: left;
  vertical-align: top;
  white-space: nowrap;
}

th {
  background: #1a1a1a;
  color: #bbb;
  font-weight: 800;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

td {
  color: #e0e0e0;
}

tbody tr:hover {
  background: #191919;
}

tbody tr:last-child td {
  border-bottom: 0;
}

/* BADGES */
.badge {
  display: inline-block;
  padding: 4px 8px;
  border-radius: 20px;
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
}

.badge.success {
  background: #10382c;
  color: var(--green);
}

.badge.danger {
  background: #401a21;
  color: var(--red);
}

.badge.warning {
  background: #3a3008;
  color: var(--yellow);
}

.badge.info {
  background: #1a2b45;
  color: var(--blue);
}

.badge.violet {
  background: #302044;
  color: var(--violet);
}

/* STATUS GRID */
.status-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}

.status-item {
  padding: 13px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: #0e0e0e;
}

.status-item span {
  display: block;
  color: var(--muted);
  font-size: 11px;
  margin-bottom: 8px;
  text-transform: uppercase;
}

.status-item strong {
  font-size: 17px;
  overflow-wrap: anywhere;
}

/* TOAST */
.toast {
  position: fixed;
  z-index: 1000;
  right: 20px;
  bottom: 20px;
  padding: 14px 20px;
  background: var(--panel2);
  border: 1px solid var(--border);
  border-left: 4px solid var(--yellow);
  border-radius: 8px;
  box-shadow: 0 10px 40px #0008;
  color: white;
  font-weight: 700;
  transition: transform 0.3s, opacity 0.3s;
  transform: translateY(100px);
  opacity: 0;
}

.toast.show {
  transform: translateY(0);
  opacity: 1;
}

.toast.error {
  border-left-color: var(--red);
}

/* CHANNEL SETTINGS FORM */
.form-group {
  margin-bottom: 18px;
}

.form-group label {
  display: block;
  margin-bottom: 8px;
  color: #ccc;
  font-size: 13px;
  font-weight: 700;
}

.form-group .hint {
  display: block;
  margin-top: 6px;
  color: var(--muted);
  font-size: 11px;
}

.switch-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 0;
  border-bottom: 1px solid #222;
}

.switch-row:last-child {
  border-bottom: none;
}

.switch {
  width: 48px;
  height: 26px;
  border-radius: 30px;
  background: #333;
  position: relative;
  cursor: pointer;
  transition: background 0.2s;
}

.switch i {
  position: absolute;
  top: 3px;
  left: 3px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #fff;
  transition: transform 0.2s;
}

.switch.on {
  background: var(--green);
}

.switch.on i {
  transform: translateX(22px);
}

/* MODALS */
.modal-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 500;
  background: #000b;
  backdrop-filter: blur(5px);
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-backdrop.open {
  display: flex;
}

.modal {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  width: 100%;
  max-width: 500px;
  box-shadow: 0 20px 70px #000;
}

.modal h3 {
  margin: 0 0 15px;
  font-size: 20px;
}

/* RESPONSIVE */
@media (max-width: 1100px) {
  .stats-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .layout {
    grid-template-columns: 190px minmax(0, 1fr);
  }
  .main {
    padding: 18px;
  }
}

@media (max-width: 720px) {
  .topbar {
    padding: 10px 13px;
  }
  .topbar .brand p {
    display: none;
  }
  .layout {
    display: block;
  }
  .sidebar {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 9px;
    border-right: 0;
    border-bottom: 1px solid var(--border);
  }
  .nav-label {
    display: none;
  }
  .nav-btn {
    flex: 0 0 auto;
    width: auto;
    white-space: nowrap;
    margin: 0;
    padding: 10px;
  }
  .main {
    padding: 15px;
  }
  .page-header h2 {
    font-size: 22px;
  }
  .two-col {
    grid-template-columns: 1fr;
    gap: 0;
  }
  .status-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .notif-dropdown {
    width: 290px;
    right: 10px;
  }
}

@media (max-width: 420px) {
  .stats-grid {
    grid-template-columns: 1fr 1fr;
    gap: 9px;
  }
  .stat-card {
    padding: 12px;
  }
  .stat-value {
    font-size: 19px;
  }
  .stat-label {
    font-size: 11px;
  }
  .topbar-right .admin-badge {
    display: none;
  }
  .status-grid {
    grid-template-columns: 1fr 1fr;
  }
}
</style>
</head>

<body>

<!-- =========================================
     LOGIN VIEW
========================================= -->
<section id="loginView">
  <div class="login-card">
    <div class="brand">
      <div class="brand-icon">₿</div>
      <div>
        <h1>CRYPTO TRADER PRO</h1>
        <p>Secure Administration</p>
      </div>
    </div>

    <h2>Admin Login</h2>
    <p>Sign in to manage and monitor your platform.</p>

    <form id="loginForm">
      <div class="field">
        <label for="loginUsername">Username</label>
        <input id="loginUsername" name="username" autocomplete="username" required maxlength="200">
      </div>

      <div class="field">
        <label for="loginPassword">Password</label>
        <input id="loginPassword" name="password" type="password" autocomplete="current-password" required maxlength="500">
      </div>

      <button class="btn btn-primary btn-block" id="loginButton" type="submit">Sign In Securely</button>
      <div id="loginError" class="error"></div>
    </form>

    <p class="small muted" style="margin-top:22px">Authorized administrators only.</p>
  </div>
</section>

<!-- =========================================
     APPLICATION VIEW
========================================= -->
<section id="appView" class="hidden">

  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">₿</div>
      <div>
        <h1>CRYPTO TRADER PRO</h1>
        <p>Administration Dashboard</p>
      </div>
    </div>

    <!-- LIVE PERIOD WIDGET (Point 4) -->
    <div class="live-widget" id="liveWidget" style="display: none;">
      <span class="live-dot"></span>
      <span class="live-period" id="livePeriodCode">...</span>
      <span class="muted">|</span>
      <span class="live-timer" id="liveTimer">--:--</span>
    </div>

    <div class="topbar-right">
      <span class="admin-badge">ADMIN</span>
      <span id="adminUsername" class="small muted"></span>
      
      <!-- NOTIFICATION BELL -->
      <button class="notif-btn" id="notifBell">
        🔔
        <span id="notifBadge" class="notif-badge hidden">0</span>
      </button>

      <button class="btn btn-danger" id="logoutButton">Logout</button>
    </div>
  </header>

  <!-- NOTIFICATION DROPDOWN -->
  <div id="notifDropdown" class="notif-dropdown hidden">
    <div class="notif-header">
      <span>Pending Requests</span>
      <button class="btn small" id="closeNotif" style="padding:4px 8px;">✕</button>
    </div>
    <div id="notifList">
      <div class="loading">Loading...</div>
    </div>
  </div>

  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
      <div id="pageContent">
        <div class="loading">Loading dashboard...</div>
      </div>
    </main>
  </div>
</section>

<div id="toast" class="toast" role="status"></div>

<!-- MANUAL RESULT MODAL -->
<div class="modal-backdrop" id="settleModal">
  <div class="modal">
    <h3>Force Settle Round</h3>
    <p class="muted small" id="settleRoundCode">Period: ...</p>
    <div class="form-group" style="margin-top: 15px;">
      <label>Result Number (0-9)</label>
      <input type="number" id="settleResultInput" min="0" max="9" placeholder="Enter number" style="font-size: 24px; text-align: center;">
    </div>
    <div style="display: flex; gap: 10px; margin-top: 20px;">
      <button class="btn btn-block" id="cancelSettleBtn">Cancel</button>
      <button class="btn btn-primary btn-block" id="confirmSettleBtn">Submit Result</button>
    </div>
  </div>
</div>

<script>
"use strict";

const API_URL = "/api/admin";

// =========================================
// VIEW CONFIGURATION (All options in sidebar - Point 1)
// =========================================
const VIEWS = [
  {
    group: "OVERVIEW",
    items: [
      ["dashboard", "▦", "Dashboard"],
      ["analytics", "◫", "Analytics"]
    ]
  },
  {
    group: "GAME CONTROL",
    items: [
      ["rounds", "◷", "Game Rounds"],
      ["prediction_history", "🎯", "Prediction History"],
      ["bets", "♠", "Bets"]
    ]
  },
  {
    group: "FINANCE",
    items: [
      ["deposits", "↓", "Deposits"],
      ["withdrawals", "↑", "Withdrawals"],
      ["transactions", "⇄", "Transactions"],
      ["users", "♙", "Users"],
      ["wallets", "◈", "Wallets"],
      ["gift_codes", "🎁", "Gift Codes"]
    ]
  },
  {
    group: "CHANNEL & BOT",
    items: [
      ["channel_settings", "📺", "Channel Settings"],
      ["broadcast", "📢", "Broadcast"],
      ["telegram", "✈", "Telegram Logs"],
      ["deposit_addresses", "⌁", "Deposit Addresses"]
    ]
  },
  {
    group: "SECURITY",
    items: [
      ["app_settings", "⚙️", "App Settings"],
      ["audit", "▤", "Audit Logs"],
      ["login_attempts", "⌁", "Login Attempts"],
      ["search", "⌕", "Global Search"]
    ]
  }
];

const state = {
  username: "",
  currentView: "dashboard",
  pages: {},
  filters: {},
  userDetailId: null,
  busy: false,
  timerInterval: null,
  settleRoundCode: null
};

const $ = id => document.getElementById(id);

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function formatNumber(value, decimals = 2) {
  if (value === null || value === undefined || value === "") {
    return "—";
  }
  const n = Number(value);
  if (!Number.isFinite(n)) {
    return String(value);
  }
  return n.toLocaleString("en-US", {
    maximumFractionDigits: decimals
  });
}

function formatDate(value) {
  if (!value) return "—";
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) {
    return String(value);
  }
  return date.toLocaleString("en-IN", {
    dateStyle: "medium",
    timeStyle: "short",
    hour12: true
  });
}

function money(value) {
  return formatNumber(value, 4);
}

function badge(value) {
  const text = String(value ?? "unknown");
  let cls = "";
  if (["completed", "confirmed", "settled", "won", "success"].includes(text.toLowerCase())) {
    cls = "success";
  } else if (["failed", "rejected", "lost", "cancelled", "error"].includes(text.toLowerCase())) {
    cls = "danger";
  } else if (["pending", "open", "locked"].includes(text.toLowerCase())) {
    cls = "warning";
  } else if (["active", "info"].includes(text.toLowerCase())) {
    cls = "info";
  }
  return `<span class="badge ${cls}">${escapeHtml(text)}</span>`;
}

function toast(message, isError = false) {
  const el = $("toast");
  el.textContent = message;
  el.className = "toast show" + (isError ? " error" : "");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => {
    el.classList.remove("show");
  }, 3500);
}

async function api(action, data = {}) {
  const response = await fetch(API_URL, {
    method: "POST",
    credentials: "same-origin",
    headers: {
      "Content-Type": "application/json",
      "X-Admin-Request": "1"
    },
    body: JSON.stringify({ action, ...data })
  });

  let result;
  try {
    result = await response.json();
  } catch {
    throw new Error("Server returned an invalid response.");
  }

  if (response.status === 401) {
    showLogin("Your session expired. Please sign in again.");
    throw new Error(result.error || "Session expired.");
  }

  if (!response.ok || result.ok === false) {
    throw new Error(result.error || result.message || "Request failed.");
  }

  return result;
}

// =========================================
// LIVE TIMER LOGIC
// =========================================
async function startLiveTimer() {
  $("liveWidget").style.display = "flex";
  clearInterval(state.timerInterval);
  
  const fetchLive = async () => {
    try {
      const res = await fetch("/api/game?page=1&page_size=1");
      const data = await res.json();
      if (data.success && data.current_round) {
        const round = data.current_round;
        const endMs = new Date(round.ends_at).getTime();
        
        $("livePeriodCode").textContent = `P: ${round.round_code}`;
        
        state.timerInterval = setInterval(() => {
          const left = Math.max(0, Math.ceil((endMs - Date.now()) / 1000));
          const timerEl = $("liveTimer");
          
          timerEl.textContent = `${String(Math.floor(left / 60)).padStart(2, "0")}:${String(left % 60).padStart(2, "0")}`;
          
          if (left <= 30) {
            timerEl.classList.add("locked");
          } else {
            timerEl.classList.remove("locked");
          }
          
          if (left <= 0) {
            clearInterval(state.timerInterval);
            fetchLive();
          }
        }, 1000);
      } else {
        $("livePeriodCode").textContent = "OFFLINE";
      }
    } catch (e) {
      $("livePeriodCode").textContent = "ERROR";
    }
  };
  
  fetchLive();
  // Refresh timer widget every 3 minutes in case of connection loss
  setTimeout(startLiveTimer, 180000);
}

async function navigate(view) {
  state.currentView = view;
  state.pages[view] = state.pages[view] || 1;

  try {
    switch (view) {
      case "dashboard": await renderDashboard(); break;
      case "analytics": await renderAnalytics(); break;

      case "prediction_history": await renderPredictionHistory(); break;
      case "bets": await renderBets(); break;
      case "deposits": await renderTransactions("deposits"); break;

      case "broadcast": await renderBroadcast(); break;

      case "deposit_addresses": await renderDepositAddresses(); break;

      ["ID", "User ID", "Type", "Amount", "Status", "TX Hash", "Created", "Action"],
      (data.transactions || []).map(t => {
        let act = "—";
        if (t.status === "pending") {
          if (t.transaction_type === "deposit") {
            act = `<div class="row-actions"><button class="btn btn-primary" onclick="reviewTx('deposit_approve','${t.id}')">Approve</button><button class="btn btn-danger" onclick="reviewTx('deposit_reject','${t.id}')">Reject</button></div>`;
          } else if (t.transaction_type === "withdrawal") {
            act = `<div class="row-actions"><button class="btn btn-primary" onclick="reviewTx('withdrawal_approve','${t.id}')">Approve</button><button class="btn btn-danger" onclick="reviewTx('withdrawal_reject','${t.id}')">Reject</button></div>`;

        }
        return [
          escapeHtml(t.id),
          escapeHtml(t.user_id),
          badge(t.transaction_type),
          money(t.amount),
          badge(t.status),
          `<code>${escapeHtml(t.tx_hash || "—")}</code>`,
          formatDate(t.created_at),
          act
        ];
      })
    )}
  `;
}

window.reviewTx = async (action, id) => {
  let txHash = "";
  if (action === "withdrawal_approve") {
    txHash = prompt("Enter Payout TX Hash:");
    if (!txHash) return;
  }
  
  if (!confirm("Are you sure you want to proceed?")) return;
  
  try {
    await api(action, { transaction_id: id, payout_tx_hash: txHash });
    toast("Action successful.");
    fetchNotifications();
    navigate(state.currentView);
  } catch (err) {
    toast(err.message, true);
  }
};

          <input name="signup_bonus_amount" value="${escapeHtml(data.signup_bonus_amount || 25)}" type="number">
        </div>
        <div class="form-group">
          <label>Channel URL</label>
          <input name="channel_url" value="${escapeHtml(data.channel_url || '')}" placeholder="https://t.me/...">
        </div>
        <div class="form-group">
          <label>Support URL</label>
          <input name="support_url" value="${escapeHtml(data.support_url || '')}" placeholder="https://t.me/...">
        </div>
        
        <div class="switch-row">
          <span>Sound Button Enabled</span>
          <div class="switch ${data.sound_button_enabled === 'true' ? 'on' : ''}" onclick="this.classList.toggle('on')"><i></i></div>
        </div>
        <div class="switch-row">
          <span>Signup Bonus Enabled</span>
          <div class="switch ${data.signup_bonus_enabled === 'true' ? 'on' : ''}" onclick="this.classList.toggle('on')"><i></i></div>
        </div>

        <button class="btn btn-primary" type="submit" style="margin-top:20px;">Save Settings</button>
      </form>
    </div>
  `;
  
  $("asForm").onsubmit = async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    const settings = Object.fromEntries(f.entries());
    settings.sound_button_enabled = document.querySelectorAll(".switch")[0].classList.contains("on") ? "true" : "false";
    settings.signup_bonus_enabled = document.querySelectorAll(".switch")[1].classList.contains("on") ? "true" : "false";
    
    try {
      await api("save_app_settings", { settings });
      toast("Settings saved!");
    } catch (err) {
      toast(err.message, true);
    }
  };
}

function renderSearch() {
  setPage("Global Search", "Search users, rounds, and bets.");
  $("viewBody").innerHTML = `
    <div class="toolbar">
      <input id="searchQ" placeholder="Search user ID, username, or round code...">
      <button class="btn btn-primary" onclick="doSearch()">Search</button>
    </div>
    <div id="searchRes"></div>
  `;
}

window.doSearch = async () => {
  const q = $("searchQ").value;
  if (!q) return;
  $("searchRes").innerHTML = '<div class="loading">Searching...</div>';
  try {
    const data = await api("search", { q });
    $("searchRes").innerHTML = `
      <h3>Users</h3>
      ${table(["ID", "Username", "Balance"], (data.users||[]).map(u => [u.id, escapeHtml(u.username||"—"), money(u.balance)]))}
      <h3 style="margin-top:20px;">Rounds</h3>
      ${table(["Round Code", "Status", "Result"], (data.rounds||[]).map(r => [r.round_code, badge(r.status), r.result_number ?? "—"]))}
    `;
  } catch (e) { $("searchRes").innerHTML = `<div class="notice danger">${e.message}</div>`; }
};

// =========================================
// NOTIFICATION BELL LOGIC
// =========================================
async function fetchNotifications() {
  try {
    const data = await api("transactions", { status: "pending", page_size: 50 });
    const pend = (data.transactions || []).filter(t => ["deposit", "withdrawal"].includes(t.transaction_type));
    
    const badge = $("notifBadge");
    if (pend.length > 0) {
      badge.textContent = pend.length > 9 ? "9+" : pend.length;
      badge.classList.remove("hidden");
    } else {
      badge.classList.add("hidden");
    }
    
    $("notifList").innerHTML = pend.length === 0 
      ? '<div class="empty">No pending requests.</div>'
      : pend.map(t => `
        <div class="notif-item">
          <strong class="${t.transaction_type === 'deposit' ? 'green' : 'red'}">${t.transaction_type.toUpperCase()} #${t.id}</strong>
          <div>User ID: ${t.user_id} | Amount: ${money(t.amount)}</div>
          <small>${formatDate(t.created_at)}</small>
        </div>
      `).join("");
  } catch (err) {
    console.error("Notification failed", err);
  }
}

$("notifBell").onclick = (e) => {
  e.stopPropagation();
  $("notifDropdown").classList.toggle("hidden");
};

$("closeNotif").onclick = () => $("notifDropdown").classList.add("hidden");

document.addEventListener("click", (e) => {
  const dropdown = $("notifDropdown");
  if (!dropdown.classList.contains("hidden") && !dropdown.contains(e.target) && !$("notifBell").contains(e.target)) {
    dropdown.classList.add("hidden");
  }
});

// =========================================
// LOGIN / LOGOUT HANDLERS
// =========================================
$("loginForm").onsubmit = async (event) => {
  event.preventDefault();
  if (state.busy) return;

  state.busy = true;
  $("loginButton").disabled = true;
  $("loginButton").textContent = "Signing In...";
  $("loginError").textContent = "";

  try {
    const username = $("loginUsername").value.trim();
    const password = $("loginPassword").value;
    const result = await api("login", { username, password });
    
    $("loginPassword").value = "";
    showApp(result.username || username);
  } catch (error) {
    $("loginError").textContent = error.message;
  } finally {
    state.busy = false;
    $("loginButton").disabled = false;
    $("loginButton").textContent = "Sign In Securely";
  }
};

$("logoutButton").onclick = async () => {
  if (!confirm("Are you sure you want to log out?")) return;
  try { await api("logout"); } catch (e) {}
  showLogin("You have been logged out.");
};

// INIT
(async function init() {
  try {
    const result = await api("me");
    if (result.username) {
      showApp(result.username);
    } else {
      showLogin();
    }
  } catch (error) {
    showLogin();
  }
})();
</script>
