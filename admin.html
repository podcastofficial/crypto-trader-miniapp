<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Crypto Trader Pro | Admin Panel</title>

<style>
:root {
  --bg: #090909;
  --panel: #121212;
  --panel2: #181818;
  --border: #292929;
  --yellow: #ffd400;
  --yellow2: #e5bd00;
  --text: #f4f4f4;
  --muted: #999;
  --green: #20d49a;
  --red: #ff5268;
  --violet: #a78bfa;
  --blue: #65a9ff;
  --radius: 14px;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, system-ui, -apple-system, sans-serif;
  font-size: 14px;
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.hidden {
  display: none !important;
}

.muted {
  color: var(--muted);
}

.small {
  font-size: 12px;
}

.green {
  color: var(--green);
}

.red {
  color: var(--red);
}

.yellow {
  color: var(--yellow);
}

.violet {
  color: var(--violet);
}

#loginView {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  background:
    radial-gradient(circle at 50% 0%, #292200 0, transparent 45%),
    var(--bg);
}

.login-card {
  width: 100%;
  max-width: 390px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 28px;
  box-shadow: 0 20px 80px #0008;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-icon {
  display: grid;
  place-items: center;
  width: 45px;
  height: 45px;
  border-radius: 13px;
  background: var(--yellow);
  color: #111;
  font-size: 23px;
  font-weight: 900;
}

.brand h1 {
  margin: 0;
  font-size: 18px;
}

.brand p {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 12px;
}

.login-card h2 {
  margin: 28px 0 6px;
  font-size: 24px;
}

.login-card > p {
  margin: 0 0 24px;
  color: var(--muted);
}

.field {
  display: flex;
  flex-direction: column;
  gap: 7px;
  margin-bottom: 16px;
}

.field label {
  color: #ccc;
  font-size: 12px;
}

input,
select,
textarea {
  min-width: 0;
  width: 100%;
  padding: 11px 12px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: #0d0d0d;
  color: var(--text);
  outline: none;
}

input:focus,
select:focus,
textarea:focus {
  border-color: var(--yellow);
}

textarea {
  resize: vertical;
  min-height: 120px;
}

.btn {
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 9px;
  color: var(--text);
  background: var(--panel2);
  font-weight: 700;
}

.btn:hover {
  border-color: #666;
}

.btn-primary {
  background: var(--yellow);
  color: #111;
  border-color: var(--yellow);
}

.btn-primary:hover {
  background: var(--yellow2);
}

.btn-danger {
  color: var(--red);
  border-color: #61242d;
  background: #2a1216;
}

.btn-danger:hover {
  background: #3a181d;
}

.btn-block {
  width: 100%;
}

.error {
  color: var(--red);
  font-size: 12px;
  margin-top: 12px;
  line-height: 1.5;
}

#appView {
  min-height: 100vh;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  min-height: 68px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  padding: 12px 22px;
  background: #101010ee;
  backdrop-filter: blur(15px);
  border-bottom: 1px solid var(--border);
}

.topbar .brand-icon {
  width: 38px;
  height: 38px;
  font-size: 19px;
}

.topbar .brand h1 {
  font-size: 15px;
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.admin-badge {
  color: var(--yellow);
  border: 1px solid #665500;
  background: #282100;
  border-radius: 20px;
  padding: 6px 10px;
  font-size: 11px;
  font-weight: 800;
}

/* --- NOTIFICATION BELL STYLES --- */
.notif-btn {
  position: relative;
  background: transparent;
  border: none;
  font-size: 20px;
  color: var(--text);
  cursor: pointer;
  padding: 8px;
  border-radius: 50%;
  transition: background 0.2s;
}

.notif-btn:hover {
  background: rgba(255, 255, 255, 0.1);
}

.notif-badge {
  position: absolute;
  top: 2px;
  right: 2px;
  background: var(--red);
  color: white;
  font-size: 10px;
  font-weight: bold;
  border-radius: 50%;
  padding: 2px 6px;
  border: 2px solid #101010;
}

.notif-dropdown {
  position: absolute;
  top: 60px;
  right: 20px;
  width: 320px;
  max-height: 400px;
  overflow-y: auto;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  z-index: 100;
}

.notif-header {
  padding: 12px 15px;
  border-bottom: 1px solid var(--border);
  font-weight: bold;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.notif-item {
  padding: 12px 15px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}

.notif-item:last-child {
  border-bottom: none;
}

.notif-item strong {
  display: block;
  margin-bottom: 4px;
}

.notif-item small {
  color: var(--muted);
  display: block;
  font-size: 11px;
  margin-top: 4px;
}

/* -------------------------------- */

.layout {
  display: grid;
  grid-template-columns: 225px minmax(0, 1fr);
  min-height: calc(100vh - 68px);
}

.sidebar {
  padding: 18px 12px;
  background: #0c0c0c;
  border-right: 1px solid var(--border);
}

.nav-label {
  margin: 14px 10px 8px;
  font-size: 10px;
  font-weight: 800;
  color: #707070;
  letter-spacing: 1.2px;
}

.nav-btn {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  text-align: left;
  padding: 11px 12px;
  margin: 3px 0;
  background: transparent;
  color: #aaa;
  border: 1px solid transparent;
  border-radius: 9px;
  font-size: 13px;
}

.nav-btn:hover {
  background: #181818;
  color: #fff;
}

.nav-btn.active {
  background: #292300;
  color: var(--yellow);
  border-color: #514500;
  font-weight: 800;
}

.nav-icon {
  width: 20px;
  text-align: center;
  font-size: 16px;
}

.main {
  min-width: 0;
  padding: 24px;
}

.page-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 22px;
}

.page-header h2 {
  margin: 0;
  font-size: 25px;
  letter-spacing: -.5px;
}

.page-header p {
  margin: 7px 0 0;
  color: var(--muted);
  line-height: 1.5;
}

.header-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.grid {
  display: grid;
  gap: 14px;
}

.stats-grid {
  grid-template-columns: repeat(4, minmax(0, 1fr));
  margin-bottom: 20px;
}

.stat-card,
.card {
  min-width: 0;
  padding: 17px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}

.stat-label {
  color: var(--muted);
  font-size: 12px;
  margin-bottom: 12px;
}

.stat-value {
  font-size: clamp(20px, 2vw, 28px);
  font-weight: 850;
  overflow-wrap: anywhere;
}

.stat-note {
  margin-top: 9px;
  font-size: 11px;
  color: var(--muted);
}

.card {
  margin-bottom: 18px;
}

.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 16px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 12px;
}

.card-head h3 {
  margin: 0;
  font-size: 15px;
}

.two-col {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px;
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin-bottom: 16px;
}

.toolbar > * {
  flex: 1 1 150px;
}

.table-wrap {
  width: 100%;
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: 10px;
}

table {
  border-collapse: collapse;
  width: 100%;
  min-width: 720px;
  font-size: 12px;
}

th,
td {
  padding: 12px;
  border-bottom: 1px solid #242424;
  text-align: left;
  vertical-align: top;
  white-space: nowrap;
}

th {
  background: #1a1a1a;
  color: #bbb;
  font-weight: 800;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

td {
  color: #e0e0e0;
}

tbody tr:hover {
  background: #191919;
}

tbody tr:last-child td {
  border-bottom: 0;
}

.badge {
  display: inline-block;
  padding: 4px 8px;
  border-radius: 20px;
  font-size: 10px;
  font-weight: 800;
  background: #252525;
  color: #ccc;
  text-transform: uppercase;
}

.badge.success {
  background: #10382c;
  color: var(--green);
}

.badge.danger {
  background: #401a21;
  color: var(--red);
}

.badge.warning {
  background: #3a3008;
  color: var(--yellow);
}

.badge.info {
  background: #1a2b45;
  color: var(--blue);
}

.badge.violet {
  background: #302044;
  color: var(--violet);
}

.status-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}

.status-item {
  padding: 13px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: #0e0e0e;
}

.status-item span {
  display: block;
  color: var(--muted);
  font-size: 11px;
  margin-bottom: 8px;
}

.status-item strong {
  font-size: 17px;
  overflow-wrap: anywhere;
}

.pagination {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 14px;
}

.pagination-actions {
  display: flex;
  gap: 7px;
}

.notice {
  padding: 12px 14px;
  margin-bottom: 16px;
  border-radius: 9px;
  background: #171717;
  border: 1px solid var(--border);
  color: #bbb;
  line-height: 1.6;
}

.notice.warning {
  background: #211c08;
  border-color: #5a4b0b;
  color: #f0dc86;
}

.notice.danger {
  background: #291217;
  border-color: #5c2730;
  color: #ffb3bd;
}

.empty {
  padding: 35px 15px;
  text-align: center;
  color: var(--muted);
}

.loading {
  padding: 22px;
  text-align: center;
  color: var(--muted);
}

.toast {
  position: fixed;
  z-index: 100;
  right: 18px;
  bottom: 18px;
  max-width: calc(100vw - 36px);
  padding: 13px 16px;
  background: #202020;
  color: white;
  border: 1px solid #444;
  border-radius: 10px;
  box-shadow: 0 10px 40px #0008;
  opacity: 0;
  transform: translateY(20px);
  transition: .3s;
}

.toast.show {
  opacity: 1;
  transform: translateY(0);
}

.toast.error-toast {
  border-color: #7b2935;
}

.chart-bars {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  min-height: 170px;
  overflow-x: auto;
  padding: 15px 5px 0;
}

.chart-col {
  flex: 1;
  min-width: 25px;
  text-align: center;
}

.chart-bar {
  min-height: 3px;
  border-radius: 5px 5px 0 0;
  background: var(--yellow);
  width: 100%;
}

.chart-label {
  margin-top: 7px;
  color: var(--muted);
  font-size: 10px;
}

.chart-number {
  font-size: 10px;
  margin-bottom: 5px;
}

.detail-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}

.detail-item {
  border: 1px solid var(--border);
  background: #0e0e0e;
  border-radius: 9px;
  padding: 12px;
  min-width: 0;
}

.detail-item span {
  display: block;
  color: var(--muted);
  font-size: 11px;
  margin-bottom: 7px;
}

.detail-item strong {
  overflow-wrap: anywhere;
}

pre {
  max-width: 100%;
  overflow: auto;
  color: #ddd;
  background: #0a0a0a;
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 13px;
  font-size: 12px;
}

/* NEW STYLES */
.copy-btn {
  background: transparent;
  border: none;
  color: var(--yellow);
  cursor: pointer;
  margin-left: 5px;
  font-size: 14px;
  padding: 0;
}

.copy-btn:hover {
  color: #fff;
}

a.tx-link {
  color: var(--blue);
  text-decoration: none;
}

}

.switch {

  border-radius: 30px;

  cursor: pointer;
  transition: background 0.2s;
}

  border-radius: 50%;

<body>

<!-- LOGIN -->
<section id="loginView">
  <div class="login-card">
    <div class="brand">
      <div class="brand-icon">₿</div>
      <div>
        <h1>CRYPTO TRADER PRO</h1>
        <p>Secure Administration</p>
      </div>
    </div>

    <h2>Admin Login</h2>
    <p>Sign in to manage and monitor your platform.</p>

    <form id="loginForm">
      <div class="field">

      <div class="brand-icon">₿</div>

        <p>Administration Dashboard</p>
      </div>
    </div>

      <span id="adminUsername" class="small muted"></span>

      <!-- NOTIFICATION BELL -->
      <button class="notif-btn" id="notifBell">

        <span id="notifBadge" class="notif-badge hidden">0</span>

        Logout
      </button>

  </header>

  <!-- NOTIFICATION DROPDOWN -->

        <div class="loading">Loading dashboard...</div>
      </div>
    </main>

  </div>
</section>

<div id="toast" class="toast hidden" role="status"></div>

<script>
"use strict";

const API_URL = "/api/admin";

const VIEWS = [
  {
    group: "OVERVIEW",
    items: [
      ["dashboard", "▦", "Dashboard"],
      ["analytics", "◫", "Analytics"],
      ["reconcile", "⇄", "Reconciliation"]
    ]
  },
  {
    group: "PLATFORM",
    items: [
      ["users", "♙", "Users"],
      ["wallets", "◈", "Wallets"],
      ["transactions", "⇄", "Transactions"],
      ["deposit_addresses", "⌁", "Deposit Addresses"],
      ["deposits", "↓", "Deposits"],
      ["withdrawals", "↑", "Withdrawals"],
      ["gift_codes", "🎁", "Gift Codes"],
      ["gift_history", "🎟️", "Gift Redemptions"],
      ["rounds", "◷", "Game Rounds"],
      ["bets", "♠", "Bets"],
      ["referrals", "♧", "Referrals"]
    ]
  },
  {
    group: "CONTROL & BOT",
    items: [
      ["channel_settings", "⚙️", "Channel Settings"],
      ["broadcast", "📢", "Broadcast"],
      ["telegram", "✈", "Telegram Logs"]
    ]
  },
  {
    group: "SECURITY",
    items: [
      ["audit", "▤", "Audit Logs"],
      ["login_attempts", "⌁", "Login Attempts"],
      ["search", "⌕", "Global Search"]
    ]
  }
];

const state = {
  username: "",
  currentView: "dashboard",
  pages: {},
  filters: {},
  userDetailId: null,
  busy: false
};

const $ = id => document.getElementById(id);

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function formatNumber(value, decimals = 2) {
  if (value === null || value === undefined || value === "") {
    return "—";
  }

  const n = Number(value);

  if (!Number.isFinite(n)) {
    return String(value);
  }

  return n.toLocaleString("en-US", {
    maximumFractionDigits: decimals
  });
}

function formatDate(value) {
  if (!value) return "—";

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) {
    return String(value);
  }

  return date.toLocaleString("en-IN", {
    dateStyle: "medium",
    timeStyle: "short",
    hour12: true
  });
}

function money(value) {
  return formatNumber(value, 4);
}

function badge(value) {
  const text = String(value ?? "unknown");
  let cls = "";

  if (
    ["completed", "confirmed", "settled", "won", "success"]
      .includes(text.toLowerCase())
  ) {
    cls = "success";
  } else if (
    ["failed", "rejected", "lost", "cancelled", "error"]
      .includes(text.toLowerCase())
  ) {
    cls = "danger";
  } else if (
    ["pending", "open", "locked"]
      .includes(text.toLowerCase())
  ) {
    cls = "warning";
  } else if (
    ["active", "info"]
      .includes(text.toLowerCase())
  ) {
    cls = "info";
  }

  return `<span class="badge ${cls}">${escapeHtml(text)}</span>`;
}

function toast(message, isError = false) {
  const el = $("toast");

  el.textContent = message;
  el.className = "toast show" + (isError ? " error-toast" : "");

  clearTimeout(toast.timer);

  toast.timer = setTimeout(() => {
    el.classList.remove("show");
  }, 3500);
}

async function api(action, data = {}) {
  const response = await fetch(API_URL, {
    method: "POST",
    credentials: "same-origin",
    headers: {
      "Content-Type": "application/json",
      "X-Admin-Request": "1"
    },
    body: JSON.stringify({
      action,
      ...data
    })
  });

  let result;

  try {
    result = await response.json();
  } catch {
    throw new Error("Server returned an invalid response.");
  }

  if (response.status === 401) {
    showLogin("Your session expired. Please sign in again.");
    throw new Error(result.error || "Session expired.");
  }

  if (!response.ok || result.ok === false) {
    throw new Error(result.error || result.message || "Request failed.");
  }

  return result;
}

function showLogin(message = "") {
  $("appView").classList.add("hidden");
  $("loginView").classList.remove("hidden");
  $("loginError").textContent = message;
  $("loginPassword").value = "";
  state.username = "";
}

function showApp(username) {
  state.username = username || "Admin";

  $("adminUsername").textContent = state.username;
  $("loginView").classList.add("hidden");
  $("appView").classList.remove("hidden");

  renderNavigation();
  navigate("dashboard");
  fetchNotifications();
  setInterval(fetchNotifications, 30000);
}

function renderNavigation() {
  const sidebar = $("sidebar");

  sidebar.innerHTML = VIEWS.map(group => `
    <div class="nav-label">${escapeHtml(group.group)}</div>
    ${group.items.map(item => `
      <button
        class="nav-btn ${state.currentView === item[0] ? "active" : ""}"
        data-view="${escapeHtml(item[0])}"
      >
        <span class="nav-icon">${item[1]}</span>
        <span>${escapeHtml(item[2])}</span>
      </button>
    `).join("")}
  `).join("");

  sidebar.querySelectorAll("[data-view]").forEach(button => {
    button.addEventListener("click", () => {
      navigate(button.dataset.view);
    });
  });
}

function setPage(title, description, actions = "") {
  $("pageContent").innerHTML = `
    <div class="page-header">
      <div>
        <h2>${escapeHtml(title)}</h2>
        <p>${escapeHtml(description)}</p>
      </div>
      <div class="header-actions">${actions}</div>
    </div>
    <div id="viewBody">
      <div class="loading">Loading data...</div>
    </div>
  `;
}

function metricCard(label, value, note = "", color = "") {
  return `
    <div class="stat-card">
      <div class="stat-label">${escapeHtml(label)}</div>
      <div class="stat-value ${color}">${escapeHtml(value)}</div>
      <div class="stat-note">${escapeHtml(note)}</div>
    </div>
  `;
}

function table(headers, rows, emptyText = "No records found.") {
  if (!rows || !rows.length) {
    return `<div class="empty">${escapeHtml(emptyText)}</div>`;
  }

  return `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>${headers.map(h => `<th>${escapeHtml(h)}</th>`).join("")}</tr>
        </thead>
        <tbody>
          ${rows.map(row => `
            <tr>${row.map(cell => `<td>${cell ?? "—"}</td>`).join("")}</tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `;
}

function detailItem(label, value) {
  return `
    <div class="detail-item">
      <span>${escapeHtml(label)}</span>
      <strong>${escapeHtml(value ?? "—")}</strong>
    </div>
  `;
}

function statValue(value, decimals = 2) {
  return formatNumber(value ?? 0, decimals);
}

async function navigate(view) {
  state.currentView = view;
  state.pages[view] = state.pages[view] || 1;

  renderNavigation();

  try {
    switch (view) {
      case "dashboard":
        await renderDashboard();
        break;
      case "analytics":
        await renderAnalytics();
        break;
      case "reconcile":
        await renderReconcile();
        break;
      case "users":
        await renderUsers();
        break;
      case "wallets":
        await renderWallets();
        break;
      case "transactions":
        await renderTransactions("transactions");
        break;
      case "deposit_addresses":
        await renderDepositAddresses();
        break;
      case "deposits":
        await renderTransactions("deposits");
        break;
      case "withdrawals":
        await renderTransactions("withdrawals");
        break;
      case "gift_codes":
        await renderGiftCodeHistory();
        break;
      case "gift_history":
        await renderGiftHistory();
        break;
      case "rounds":
        await renderRounds();
        break;
      case "bets":
        await renderBets();
        break;
      case "referrals":
        await renderReferrals();
        break;
      case "channel_settings":
        await renderChannelSettings();
        break;
      case "broadcast":
        await renderBroadcast();
        break;
      case "telegram":
        await renderTelegram();
        break;
      case "audit":
        await renderAudit();
        break;
      case "login_attempts":
        await renderLoginAttempts();
        break;
      case "search":
        renderSearch();
        break;
      default:
        setPage("Not Found", "Unknown dashboard section.");
        $("viewBody").innerHTML = '<div class="empty">This section is unavailable.</div>';
    }
  } catch (error) {
    if (view === state.currentView) {
      $("pageContent").innerHTML = `
        <div class="page-header">
          <div>
            <h2>${escapeHtml(viewLabel(view))}</h2>
            <p>Unable to load this section.</p>
          </div>
          <button class="btn" id="retryButton">Retry</button>
        </div>
        <div class="notice danger">${escapeHtml(error.message)}</div>
      `;
      $("retryButton").addEventListener("click", () => navigate(view));
    }
  }
}

function viewLabel(view) {
  for (const group of VIEWS) {
    for (const item of group.items) {
      if (item[0] === view) return item[2];
    }
  }
  return view;
}

// --- DASHBOARD ---
async function renderDashboard() {
  setPage("Dashboard", "Live overview of users, balances, transactions and game activity.", '<button class="btn" id="refreshDashboard">↻ Refresh</button>');
  $("refreshDashboard").addEventListener("click", renderDashboard);

  const data = await api("dashboard");
  const t = data.totals || {};
  const m = data.user_metrics || {};
  const h = data.health || {};
  const security = data.security || {};

  $("viewBody").innerHTML = `
    <div class="grid stats-grid">
      ${metricCard("Total Users", statValue(t.users, 0), `${statValue(t.blocked_users, 0)} blocked`)}
      ${metricCard("Total Bets", statValue(t.bets, 0), "All recorded bets")}

      ${metricCard("Confirmed Withdrawals", money(t.total_withdrawals), `${statValue(t.withdrawal_count, 0)} transactions`, "red")}
      ${metricCard("Withdrawals Today", money(t.withdrawals_today), `${statValue(t.pending_withdrawals, 0)} pending`, "red")}
      ${metricCard("Referral Commissions", money(t.total_commissions), `${statValue(t.total_referrals, 0)} referrals`, "violet")}

    <div class="card">
      <div class="card-head">
        <h3>User Activity</h3>
      </div>
      <div class="status-grid">
        <div class="status-item"><span>New Today</span><strong>${statValue(m.new_today, 0)}</strong></div>
        <div class="status-item"><span>New in 7 Days</span><strong>${statValue(m.new_7d, 0)}</strong></div>
        <div class="status-item"><span>Active in 24 Hours</span><strong>${statValue(m.active_24h, 0)}</strong></div>
        <div class="status-item"><span>Active in 7 Days</span><strong>${statValue(m.active_7d, 0)}</strong></div>
        <div class="status-item"><span>Inactive 30 Days</span><strong>${statValue(m.inactive_30d, 0)}</strong></div>
        <div class="status-item"><span>Failed Logins (24h)</span><strong class="red">${statValue(security.failed_logins_24h, 0)}</strong></div>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h3>System Health</h3></div>
      <div class="status-grid">

          <span>Database Query</span>
          <strong class="green">Responding</strong>
        </div>
        <div class="status-item">

          <strong class="${h.cron_ok ? "green" : "red"}">${h.cron_ok ? "No Detected Issues" : "Needs Review"}</strong>
        </div>
        <div class="status-item">
          <span>Overdue Rounds</span>
          <strong class="${Number(h.overdue_rounds || 0) ? "red" : "green"}">${statValue(h.overdue_rounds, 0)}</strong>
        </div>
        <div class="status-item">
          <span>Old Pending Bets</span>
          <strong class="${Number(h.old_pending_bets || 0) ? "red" : "green"}">${statValue(h.old_pending_bets, 0)}</strong>
        </div>
        <div class="status-item">
          <span>Latest Round Start</span>
          <strong style="font-size:12px">${escapeHtml(formatDate(h.latest_round_start))}</strong>
        </div>
        <div class="status-item">
          <span>Last Settled Round</span>
          <strong style="font-size:12px">${escapeHtml(formatDate(h.last_settled_at))}</strong>

  `;

// --- USERS (UPDATED WITH NAMES) ---
async function renderUsers() {
  setPage("User Management", "Browse registered users and filter by activity segment.", '<button class="btn" id="exportUsers">Export CSV</button>');

  $("viewBody").innerHTML = filterToolbar({
    search: "Search username, user ID or Telegram ID",
    segment: true
  });

  attachFilterActions("users", renderUsers);

  $("exportUsers").addEventListener("click", async () => {
    try {
      await downloadCsv("users", state.filters.users || {});
    } catch (error) {
      toast(error.message, true);
    }
  });

  const f = state.filters.users || {};

  const data = await api("users", {
    page: state.pages.users || 1,
    page_size: 20,
    q: f.q || "",
    segment: f.segment || "all"
  });

  $("viewBody").innerHTML = `
    ${filterToolbar({
      search: "Search username, user ID or Telegram ID",
      segment: true
    })}
    ${table(
      ["User ID", "Name", "Telegram ID", "Username", "Balance", "Referrals", "Joined", "Details"],
      (data.users || []).map(u => {
        const fullName = [u.first_name, u.last_name].filter(Boolean).join(" ");
        return [
          escapeHtml(u.id),
          escapeHtml(fullName || "—"),
          escapeHtml(u.telegram_id),
          escapeHtml(u.username || "—"),
          escapeHtml(money(u.balance)),
          escapeHtml(statValue(u.referral_count, 0)),
          escapeHtml(formatDate(u.created_at)),
          `<button class="btn" data-user-detail="${escapeHtml(u.id)}">View</button>`
        ];
      })
    )}
    ${paginationHtml(data.pagination)}
    <div id="userDetail"></div>
  `;

  attachFilterActions("users", renderUsers);
  attachPagination("users", data.pagination, renderUsers);

  $("exportUsers").addEventListener("click", async () => {
    try {
      await downloadCsv("users", state.filters.users || {});
    } catch (error) {
      toast(error.message, true);
    }
  });

  $("viewBody").querySelectorAll("[data-user-detail]").forEach(button => {
    button.addEventListener("click", () => renderUserDetail(button.dataset.userDetail));
  });
}

async function renderUserDetail(userId) {
  const container = $("userDetail");
  container.innerHTML = '<div class="loading">Loading user details...</div>';

  try {
    const data = await api("user_detail", { user_id: userId });
    const p = data.profile || {};
    const s = data.stats || {};
    const fullName = [p.first_name, p.last_name].filter(Boolean).join(" ");

    container.innerHTML = `
      <div class="card" style="margin-top:18px">
        <div class="card-head">
          <h3>User Details — #${escapeHtml(p.id)} ${fullName ? `(${escapeHtml(fullName)})` : ''}</h3>
          <button class="btn" id="closeUserDetail">Close</button>
        </div>

        <div class="detail-grid">
          ${detailItem("Telegram ID", p.telegram_id)}
          ${detailItem("Name", fullName || "—")}
          ${detailItem("Username", p.username || "—")}
          ${detailItem("Balance", money(p.balance))}
          ${detailItem("Referral Code", p.referral_code || "—")}
          ${detailItem("Referred By", p.referred_by ?? "—")}
          ${detailItem("Joined", formatDate(p.created_at))}
          ${detailItem("Total Bets", statValue(s.bets, 0))}
          ${detailItem("Total Stake", money(s.stake))}
          ${detailItem("Total Payout", money(s.payout))}
          ${detailItem("Wins", statValue(s.wins, 0))}
          ${detailItem("Losses", statValue(s.losses, 0))}
        </div>

        <div class="card" style="margin-top:16px">
          <h3>Admin actions</h3>
          <div class="row-actions" style="margin-top:10px">
            <button class="btn user-action" data-action="block" data-user-id="${escapeHtml(p.id)}">Block</button>
            <button class="btn user-action" data-action="unblock" data-user-id="${escapeHtml(p.id)}">Unblock</button>
            <button class="btn user-action" data-action="add_fund" data-user-id="${escapeHtml(p.id)}">Add fund</button>
            <button class="btn user-action" data-action="remove_fund" data-user-id="${escapeHtml(p.id)}">Remove fund</button>
            <button class="btn user-action" data-action="create_gift" data-user-id="${escapeHtml(p.id)}">Generate gift code</button>
            <button class="btn user-action" data-action="transfer_points" data-user-id="${escapeHtml(p.id)}">Transfer points</button>
          </div>
        </div>
      </div>
    `;

    $("closeUserDetail").addEventListener("click", () => container.innerHTML = "");

    container.querySelectorAll(".user-action").forEach(button => button.addEventListener("click", async () => {
      const action = button.dataset.action;
      const points = ["add_fund", "remove_fund", "transfer_points"].includes(action) ? prompt("Points amount") : null;
      if (["add_fund", "remove_fund", "transfer_points"].includes(action) && (!points || Number(points) <= 0)) return;

      const payload = { management_action: action, user_id: button.dataset.userId };
      if (points) payload.points = points;
      if (action === "transfer_points") {
        payload.to_user_id = prompt("Target user ID") || "";
        if (!payload.to_user_id) return;
      }
      if (action === "create_gift") {
        payload.points = prompt("Gift code points") || "";
        payload.max_uses = prompt("Maximum uses", "1") || "1";
      }

      try {
        const result = await api("user_management", payload);
        toast(action === "create_gift" ? `Gift code: ${result.gift_code.code}` : "User action completed.");
        await renderUserDetail(button.dataset.userId);
      } catch (error) {
        toast(error.message, true);
      }
    }));
  } catch (error) {
    container.innerHTML = `<div class="notice danger">${escapeHtml(error.message)}</div>`;
  }
}

// --- TRANSACTIONS (UPDATED WITH WALLET & TX LINK) ---
async function renderTransactions(view) {
  const title = view === "deposits"
    ? "Deposits"
    : view === "withdrawals"
      ? "Withdrawals"
      : "Transactions";

  setPage(
    title,
    "Review and approve pending deposits and withdrawals.",
    '<button class="btn" id="exportTransactions">Export CSV</button>'
  );

  $("viewBody").innerHTML = filterToolbar({
    type: view === "transactions",
    status: true,
    userId: true
  });

  attachFilterActions(view, () => renderTransactions(view));

  const f = state.filters[view] || {};

  let type = f.type || "";

  if (view === "deposits") type = "deposit";
  if (view === "withdrawals") type = "withdrawal";

  const data = await api("transactions", {
    page: state.pages[view] || 1,
    page_size: 20,
    type,
    status: f.status || "",
    user_id: f.user_id || ""
  });

  $("viewBody").innerHTML = `
    ${filterToolbar({
      type: view === "transactions",
      status: true,
      userId: true
    })}
    <div class="notice warning">
      Approve means manual payout/credit. Reject/Refund returns reserved funds to the user. Deposit approval credits 100 points per USDT.
    </div>
    ${table(
      ["ID", "User ID", "Type", "Amount", "Status", "Destination / TX Hash", "Created", "Actions"],
      (data.transactions || []).map(t => {
        let actionButtons = "—";

        if (t.status === "pending") {
          if (t.transaction_type === "deposit") {
            actionButtons = `<div class="row-actions"><button class="btn btn-primary review-tx" data-action="deposit_approve" data-id="${escapeHtml(t.id)}">Approve</button><button class="btn btn-danger review-tx" data-action="deposit_reject" data-id="${escapeHtml(t.id)}">Reject</button></div>`;
          } else if (t.transaction_type === "withdrawal") {
            actionButtons = `<div class="row-actions"><button class="btn btn-primary review-tx" data-action="withdrawal_approve" data-id="${escapeHtml(t.id)}">Approve</button><button class="btn btn-danger review-tx" data-action="withdrawal_reject" data-id="${escapeHtml(t.id)}">Reject</button></div>`;
          }
        }

        let txInfo = "—";
        if (t.transaction_type === "withdrawal" && t.destination_address) {
          txInfo = `<div style="font-size:10px; color:#65a9ff; word-break:break-all;">${escapeHtml(t.destination_address)} <button class="copy-btn" onclick="navigator.clipboard.writeText('${t.destination_address}'); toast('Copied!')">📋</button></div>`;
        } else if (t.tx_hash) {
          txInfo = `<a class="tx-link" href="https://bscscan.com/tx/${t.tx_hash}" target="_blank">${t.tx_hash.slice(0, 8)}...${t.tx_hash.slice(-6)}</a>`;
        }

        return [
          escapeHtml(t.id),
          escapeHtml(t.user_id),
          badge(t.transaction_type),
          escapeHtml(money(t.amount)),
          badge(t.status),
          txInfo,
          escapeHtml(formatDate(t.created_at)),
          actionButtons
        ];
      })
    )}
    ${paginationHtml(data.pagination)}
  `;

  attachFilterActions(view, () => renderTransactions(view));
  attachPagination(view, data.pagination, () => renderTransactions(view));

  document.querySelectorAll(".review-tx").forEach(button => button.addEventListener("click", async () => {
    const action = button.dataset.action;

    let message = "Are you sure?";
    if (action === "withdrawal_approve") message = "Approve this withdrawal for manual payout?";
    const payoutTxHash = action === "withdrawal_approve" ? prompt("Enter the payout transaction hash:") : "";
    if (action === "withdrawal_approve" && !payoutTxHash?.trim()) return;
    if (action === "withdrawal_reject") message = "Reject and refund this withdrawal?";
    if (action === "deposit_approve") message = "Approve this deposit? Points will be credited to the user.";
    if (action === "deposit_reject") message = "Reject this deposit?";

    if (!window.confirm(message)) return;
    try {
      await api(action, { transaction_id: button.dataset.id, payout_tx_hash: payoutTxHash?.trim() || "" });
      toast("Action successful.");
      fetchNotifications();
      await renderTransactions(view);
    } catch (error) {
      toast(error.message, true);
    }
  }));

  $("exportTransactions").addEventListener("click", async () => {
    try {
      await downloadCsv("transactions", {
        ...state.filters[view],
        type
      });
    } catch (error) {
      toast(error.message, true);
    }
  });
}

// --- HELPERS ---
function filterToolbar(options = {}) {
  return `
    <div class="toolbar">
      ${options.search ? `<input id="filterQ" placeholder="${escapeHtml(options.search)}" value="${escapeHtml(options.q || "")}">` : ""}
      ${options.segment ? `
        <select id="filterSegment">
          <option value="all">All Users</option>
          <option value="new_today">New Today</option>
          <option value="new_7d">New in 7 Days</option>
          <option value="active_24h">Active in 24 Hours</option>
          <option value="active_7d">Active in 7 Days</option>
          <option value="inactive_30d">Inactive 30 Days</option>
        </select>
      ` : ""}
      ${options.type ? `
        <select id="filterType">
          <option value="">All Types</option>
          <option value="deposit">Deposit</option>
          <option value="withdrawal">Withdrawal</option>
        </select>
      ` : ""}
      ${options.status ? `
        <select id="filterStatus">
          <option value="">All Statuses</option>
          ${["pending", "confirmed", "rejected", "completed", "failed", "open", "locked", "settled", "won", "lost", "cancelled"]
            .map(s => `<option value="${s}">${s}</option>`).join("")}
        </select>
      ` : ""}
      ${options.userId ? `<input id="filterUserId" inputmode="numeric" placeholder="User ID">` : ""}
      <button class="btn btn-primary" id="applyFilters">Apply Filters</button>
      <button class="btn" id="clearFilters">Clear</button>
    </div>
  `;
}

function getFilters(view) {
  const saved = state.filters[view] || {};

  return {
    q: $("filterQ") ? $("filterQ").value.trim() : (saved.q || ""),
    segment: $("filterSegment") ? $("filterSegment").value : (saved.segment || "all"),
    type: $("filterType") ? $("filterType").value : (saved.type || ""),
    status: $("filterStatus") ? $("filterStatus").value : (saved.status || ""),
    user_id: $("filterUserId") ? $("filterUserId").value.trim() : (saved.user_id || "")
  };
}

function attachFilterActions(view, renderFunction) {
  const f = state.filters[view] || {};

  if ($("filterQ")) $("filterQ").value = f.q || "";
  if ($("filterSegment")) $("filterSegment").value = f.segment || "all";
  if ($("filterType")) $("filterType").value = f.type || "";
  if ($("filterStatus")) $("filterStatus").value = f.status || "";
  if ($("filterUserId")) $("filterUserId").value = f.user_id || "";

  $("applyFilters").addEventListener("click", () => {
    state.filters[view] = getFilters(view);
    state.pages[view] = 1;
    renderFunction();
  });

  $("clearFilters").addEventListener("click", () => {
    state.filters[view] = {};
    state.pages[view] = 1;
    renderFunction();
  });

  if ($("filterQ")) {
    $("filterQ").addEventListener("keydown", event => {
      if (event.key === "Enter") {
        state.filters[view] = getFilters(view);
        state.pages[view] = 1;
        renderFunction();
      }
    });
  }
}

function paginationHtml(info) {
  if (!info) return "";

  return `
    <div class="pagination">
      <span class="small muted">
        Page ${escapeHtml(info.page)} of ${escapeHtml(info.total_pages)}
        · ${escapeHtml(info.total)} records
      </span>
      <div class="pagination-actions">
        <button class="btn" id="previousPage" ${info.has_previous ? "" : "disabled"}>← Previous</button>
        <button class="btn" id="nextPage" ${info.has_next ? "" : "disabled"}>Next →</button>
      </div>
    </div>
  `;
}

function attachPagination(view, info, renderFunction) {
  if (!info) return;

  if ($("previousPage")) {
    $("previousPage").addEventListener("click", () => {
      state.pages[view] = Math.max(1, (state.pages[view] || 1) - 1);
      renderFunction();
    });
  }

  if ($("nextPage")) {
    $("nextPage").addEventListener("click", () => {
      state.pages[view] = (state.pages[view] || 1) + 1;
      renderFunction();
    });
  }
}

async function downloadCsv(dataset, filters = {}) {
  const data = await api("export", {
    dataset,
    ...filters
  });

  if (!data.csv) {
    return toast("No rows available to export.");
  }

  const blob = new Blob(["\uFEFF", data.csv], {
    type: "text/csv;charset=utf-8"
  });

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = `crypto-trader-${dataset}-${new Date().toISOString().slice(0, 10)}.csv`;

  document.body.appendChild(link);
  link.click();
  link.remove();

  URL.revokeObjectURL(url);

  toast(
    `Exported ${data.row_count} rows` +
    (data.truncated ? ". Export limit reached." : ".")
  );
}

async function fetchNotifications() {
  try {
    const data = await api("transactions", {
      status: "pending",
      page_size: 50
    });

    const pendingTxs = (data.transactions || []).filter(t =>
      ["deposit", "withdrawal"].includes(t.transaction_type)
    );

    const badge = $("notifBadge");

    if (pendingTxs.length > 0) {
      badge.textContent = pendingTxs.length > 9 ? "9+" : pendingTxs.length;
      badge.classList.remove("hidden");
    } else {
      badge.classList.add("hidden");
    }

    const list = $("notifList");

    list.innerHTML = pendingTxs.length === 0
      ? '<div class="empty">No pending requests.</div>'
      : pendingTxs.map(t => `
        <div class="notif-item">
          <strong class="${t.transaction_type === 'deposit' ? 'green' : 'red'}">
            ${t.transaction_type.toUpperCase()} #${escapeHtml(t.id)}
          </strong>
          <div>User ${escapeHtml(t.user_id)} | ${money(t.amount)}</div>
          <small>${formatDate(t.created_at)}</small>
        </div>
      `).join("");
  } catch (error) {
    console.error("Notification failed", error);
  }
}

$("notifBell").addEventListener("click", (e) => {
  e.stopPropagation();
  $("notifDropdown").classList.toggle("hidden");
});

$("closeNotif").addEventListener("click", () => $("notifDropdown").classList.add("hidden"));

document.addEventListener("click", (e) => {
  const dropdown = $("notifDropdown");
  if (
    !dropdown.classList.contains("hidden") &&
    !dropdown.contains(e.target) &&
    !$("notifBell").contains(e.target)
  ) {
    dropdown.classList.add("hidden");
  }
});

$("loginForm").addEventListener("submit", async event => {
  event.preventDefault();

  if (state.busy) return;

  state.busy = true;
  $("loginButton").disabled = true;
  $("loginButton").textContent = "Signing In...";
  $("loginError").textContent = "";

  try {
    const result = await api("login", {
      username: $("loginUsername").value.trim(),
      password: $("loginPassword").value
    });

    $("loginPassword").value = "";
    showApp(result.username || $("loginUsername").value);
  } catch (error) {
    $("loginError").textContent = error.message;
  } finally {
    state.busy = false;
    $("loginButton").disabled = false;
    $("loginButton").textContent = "Sign In Securely";
  }
});

$("logoutButton").addEventListener("click", async () => {
  if (!confirm("Are you sure you want to log out?")) return;

  try {
    await api("logout");
  } catch (error) {}

  showLogin("You have been logged out.");
});

(async function init() {
  try {
    const result = await api("me");
    if (result.username) {
      showApp(result.username);
    } else {
      showLogin();
    }
  } catch (error) {
    showLogin();
  }
})();
</script>
